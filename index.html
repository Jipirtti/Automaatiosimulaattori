<!doctype html>
<!--
  Automaatiosimulaattori – relelogiikka, PLC, ohjauspiirit, anturit ja toimilaitteet
  Tekijä: Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK), 2026.
  Suunnittelu, sisältö ja validointi: Juho Pirttilahti. Ohjelmakoodi toteutettu tekoälyavusteisesti (Claude, Anthropic).
  Lisenssi: Creative Commons Nimeä 4.0 Kansainvälinen (CC BY 4.0), https://creativecommons.org/licenses/by/4.0/deed.fi
  Saat kopioida, jakaa ja muokata ohjelmaa mihin tahansa tarkoitukseen, kunhan mainitset
  tekijän ja oppilaitoksen, merkitset lisenssin ja kerrot tekemistäsi muutoksista.
-->
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Automaatiosimulaattori</title>
<meta name="author" content="Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK)">
<meta name="copyright" content="Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK), 2026. CC BY 4.0">
<link rel="license" href="https://creativecommons.org/licenses/by/4.0/deed.fi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#DCE3E9; --paper:#F7F9FA; --grid:#E2E8ED; --grid2:#D3DBE2; --panel:#EDF1F4; --ink:#17212B; --muted:#56636F;
  --line:#C2CBD3; --acc:#E39B17; --sel:#1E5DBA; --ok:#2E8B57; --warn:#C0392B; --on:#E39B17;
  --scr:#0D1418; --scrgrid:#2A3A40; --scrtxt:#9FB3BA;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --paper:#131A20; --grid:#1A232B; --grid2:#222D36; --panel:#161F26; --ink:#E2E8EE; --muted:#93A0AC;
    --line:#2A3540; --acc:#F0A82A; --sel:#6FA7FF; --ok:#4CC38A; --warn:#FF6B5B; --on:#F0A82A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --paper:#131A20; --grid:#1A232B; --grid2:#222D36; --panel:#161F26; --ink:#E2E8EE; --muted:#93A0AC;
  --line:#2A3540; --acc:#F0A82A; --sel:#6FA7FF; --ok:#4CC38A; --warn:#FF6B5B; --on:#F0A82A;
}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:1px}

.app{height:100%;display:grid;grid-template-columns:222px minmax(0,1fr) 316px;grid-template-rows:auto minmax(0,1fr) 250px;
  grid-template-areas:"bar bar bar" "pal stage insp" "pal scope insp"}
.bar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
.brand strong{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;font-weight:600}
.brand span{font-size:13px;color:var(--muted)}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langsw button{border:0;background:var(--paper);padding:5px 12px;cursor:pointer;font-size:14px;font-weight:600}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mnote{font-size:13px;color:var(--muted);margin:6px 0 2px}
.btn{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--muted)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:118px}
.btn.on{background:var(--acc);border-color:var(--acc);color:#1E1404}
.btn.danger{color:var(--warn)}
select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:34px}
.mini{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.time{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;font-variant-numeric:tabular-nums;min-width:130px}

.pal{grid-area:pal;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 8px 20px}
.pal h3{font-size:13px;font-weight:600;color:var(--muted);margin:12px 4px 6px}
.pal h3:first-child{margin-top:2px}
.copy a,.mcopy a{color:inherit}
.copy{font-size:11.5px;line-height:1.35;color:var(--muted);margin:14px 4px 0;padding-top:10px;border-top:1px solid var(--line)}
.mcopy{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.pitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px 4px 4px;margin:0 0 5px;cursor:grab;touch-action:none;user-select:none;font-size:14px;line-height:1.15}
.pitem:hover{border-color:var(--acc)}
.pitem svg{width:46px;height:34px;flex:none;color:var(--ink)}
.ghost{position:fixed;pointer-events:none;z-index:50;background:var(--paper);border:1px solid var(--acc);border-radius:8px;padding:4px 10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}

.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;color:var(--ink);user-select:none;-webkit-user-select:none}
.tools{position:absolute;left:10px;top:10px;z-index:5;display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;max-width:calc(100% - 20px)}
.tools button{border:0;background:transparent;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tools .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.tools label{display:flex;align-items:center;gap:5px;font-size:14px;padding:0 8px;color:var(--muted)}
.status{position:absolute;left:10px;right:10px;bottom:8px;z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;pointer-events:none}
.legendp{pointer-events:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.legendp .grad{width:120px;height:9px;border-radius:5px;background:linear-gradient(90deg,#2E6FD0,#7A8794 50%,#D23B2E)}
.legendp select{min-height:26px;padding:1px 4px;font-size:13px}
.warns{pointer-events:auto;font-size:13px;display:flex;flex-direction:column;gap:3px;max-width:560px}
.warns div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:3px 8px}
.warns div.info{border-left-color:var(--sel)}
.tip{position:absolute;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums}

.insp{grid-area:insp;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:12px 14px 30px}
.insp h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:600;margin:0 0 2px}
.insp h3{font-size:14px;font-weight:600;margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.insp p{margin:0 0 8px;color:var(--muted)}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ih input{width:86px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:600;background:transparent;border:1px solid transparent;border-radius:6px;padding:0 4px}
.ih input:hover,.ih input:focus{border-color:var(--line);background:var(--paper)}
.tn{color:var(--muted);font-size:14px}
.fld{display:grid;grid-template-columns:1fr 128px;gap:8px;align-items:center;margin:0 0 6px;font-size:14px}
.fld .inp{display:flex;align-items:center;gap:4px}
.fld input,.fld select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:30px;font-variant-numeric:tabular-nums}
.fld em{font-style:normal;color:var(--muted);font-size:12.5px;min-width:34px}
.der{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0;font-size:14px}
.der dt{color:var(--muted)}
.der dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.der .bad{color:var(--warn);font-weight:600}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.help .res{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:6px 0;font-size:14px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.kbd{font-size:12.5px;color:var(--muted)}

/* aikakaavio */
.scope{grid-area:scope;border-top:1px solid var(--line);background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);gap:6px 10px;padding:6px 12px 8px;min-height:0}
.app.plcmode{grid-template-rows:auto minmax(0,1fr) 54vh}
.tabs{grid-column:1/-1;display:flex;gap:4px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:3px 12px;cursor:pointer;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.plced{grid-column:1/-1;overflow:auto;min-height:0;font-size:13px}
.plced[hidden],.scr[hidden],.sctl[hidden]{display:none}
.ldbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;position:sticky;top:0;background:var(--panel);padding:2px 0 6px;z-index:2}
.ldbar button{border:1px solid var(--line);background:var(--paper);border-radius:6px;min-width:38px;height:30px;cursor:pointer;font:600 13px ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.ldbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ldbar label{display:flex;align-items:center;gap:4px;color:var(--muted);margin-left:6px}
.ldbar input{width:64px;min-height:28px;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}
.ldbar .btn{min-height:30px;padding:2px 10px}
.ldhead{margin:2px 0 6px}
.ldr{margin:0 0 8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 6px;width:max-content;max-width:none}
.ldrh{display:flex;gap:6px;align-items:center;margin-bottom:2px}
.ldrh input{width:260px;min-height:24px;padding:1px 5px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font:inherit}
.ldrh button{border:1px solid var(--line);background:var(--paper);border-radius:5px;height:24px;cursor:pointer;color:var(--ink)}
.ldrh button:disabled{opacity:.4;cursor:default}
.rung{display:block}
.ldcell{fill:transparent;stroke:var(--grid2);stroke-dasharray:2 3;cursor:pointer}
.ldcell:hover{fill:rgba(30,93,186,.06)}
.ldoutc{stroke:var(--line)}
.ldsel{stroke:var(--sel);stroke-dasharray:none;stroke-width:2}
.ldrail{stroke:var(--ink);stroke-width:3}
.ldw{stroke:var(--ink);stroke-width:2;fill:none}
.ldb{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.ldon{stroke:#2E9E4F;stroke-width:3}
.ldb.ldon{fill:rgba(46,158,79,.12)}
.lda{fill:var(--ink);font:600 11px "Barlow",system-ui,sans-serif;text-anchor:middle}
.lds{fill:var(--muted);font:500 10px "Barlow",system-ui,sans-serif;text-anchor:middle}
.ldt{fill:var(--ink);font:600 10px "Barlow",system-ui,sans-serif;text-anchor:middle}
.ldp{fill:var(--muted);font:500 9.5px "Barlow",system-ui,sans-serif;text-anchor:middle}
.scr{position:relative;min-height:0;display:flex;flex-direction:column;gap:4px}
.scr canvas{flex:1;min-height:0;width:100%;display:block;background:var(--paper);border-radius:8px;border:1px solid var(--line);cursor:crosshair}
.curs{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:18px}
.sctl{overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:6px;min-height:0}
.sctl .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sctl select{min-height:28px;padding:2px 5px;font-size:13px;border-radius:6px}
.sctl .lbl{color:var(--muted)}
.ch{display:grid;grid-template-columns:14px minmax(0,1fr) 26px;gap:6px;align-items:center}
.ch i{width:12px;height:12px;border-radius:3px;display:inline-block}
.ch .tg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch button{border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;height:24px}
.empty{color:var(--muted);font-size:13px;margin:2px 0}
.legw{display:flex;align-items:center;gap:4px}
.legw i{width:18px;height:4px;border-radius:2px;display:inline-block}

.modal{position:fixed;inset:0;background:rgba(10,15,20,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
.mbox h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;margin:0 0 8px}
.mbox h3{font-size:15px;margin:14px 0 4px}
.mbox p{margin:0 0 8px;max-width:70ch}
.mbox textarea{width:100%;height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:flex-end}

/* SVG */
.sy{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.syf{fill:var(--paper);stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.fi{fill:currentColor}
.dash{stroke-dasharray:4 3}
.cond{fill:var(--on);stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.hot{stroke:var(--on);stroke-width:3}
.sym{fill:currentColor;font:600 14px "Barlow",system-ui,sans-serif}
.syms{fill:currentColor;font:600 11px "Barlow",system-ui,sans-serif}
.hit{fill:transparent;stroke:none}
.comp{cursor:move}
.wh{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.wb{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.wire.brk .wb{stroke-dasharray:6 5}
.hotl{stroke:var(--on);stroke-width:2.6}
.led{stroke:currentColor;stroke-width:1}
.mot{fill:none;stroke:var(--on);stroke-width:2.4}
.wire.selw .wb{stroke-width:5}
.wire.selw .wh{cursor:move}
.boxsel{fill:rgba(30,93,186,.08);stroke:#1E5DBA;stroke-width:1.2;stroke-dasharray:5 4}
.selr{fill:none;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:5 4}
.port{fill:var(--paper);stroke:currentColor;stroke-width:1.5;cursor:crosshair}
.port.con{fill:currentColor}
.port:hover{stroke:var(--sel);stroke-width:3}
.pt{fill:var(--muted);font:500 10px "Barlow",system-ui,sans-serif;pointer-events:none}
.lt{fill:currentColor;font:600 12.5px "Barlow",system-ui,sans-serif;pointer-events:none}
.rt{fill:var(--muted);font:500 12px "Barlow",system-ui,sans-serif;pointer-events:none;font-variant-numeric:tabular-nums}
.probe{cursor:grab}
.probe rect{fill:var(--paper);stroke-width:1.8}
.probe text{font:600 12.5px "Barlow",system-ui,sans-serif;fill:currentColor;font-variant-numeric:tabular-nums}
.probe line{stroke-width:1.3;stroke-dasharray:3 2}
#tmpWire{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}

@media (max-width:900px){
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto auto 62vh auto auto;
    grid-template-areas:"bar" "pal" "stage" "scope" "insp"}
  .pal{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .pal h3,.pal .copy{display:none}
  .pitem{width:auto;flex:none;margin:0;touch-action:pan-x}
  .insp{border-left:0;border-top:1px solid var(--line)}
  .scope{grid-template-columns:1fr}
  .scr canvas{height:240px;flex:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><strong data-en="Automation Simulator" data-de="Automatisierungs-Simulator">Automaatiosimulaattori</strong><span>Juho Pirttilahti, SEAMK 2026, CC BY 4.0</span></div>
    <div class="langsw" role="group" aria-label="Kieli / Language"><button type="button" data-lang="fi" lang="fi">FI</button><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="de" lang="de">DE</button></div>
    <div class="grp">
      <button class="btn pri" id="runBtn" type="button">Pysäytä</button>
      <button class="btn" id="resetBtn" type="button" title="Releet, ajastimet, sylinterit ja suojalaitteet alkutilaan, aika nollaan" data-en-title="Relays, timers, cylinders and protective devices to their initial state, time to zero" data-de-title="Relais, Zeitrelais, Zylinder und Schutzgeräte in den Anfangszustand, Zeit auf null" data-en="Reset state" data-de="Zustand zurücksetzen">Nollaa tila</button>
      <label class="mini"><span data-en="Sim. speed" data-de="Sim.-Geschwindigkeit">Nopeus</span>
        <select id="speed">
          <option value="0.1" data-en="0.1 s/s (slow motion)" data-de="0,1 s/s (Zeitlupe)">0,1 s/s (hidastus)</option>
          <option value="0.25">0,25 s/s</option>
          <option value="1" data-en="1 s/s (real time)" data-de="1 s/s (Echtzeit)">1 s/s (reaaliaika)</option>
          <option value="5">5 s/s</option>
          <option value="10">10 s/s</option>
        </select>
      </label>
      <span class="time" id="simTime">t = 0,000 s</span>
    </div>
    <div class="grp">
      <select id="exSel" aria-label="Esimerkkipiirit" data-en-aria="Example circuits" data-de-aria="Beispielschaltungen">
        <option value="" data-en="Example circuits…" data-de="Beispielschaltungen …">Esimerkkipiirit…</option>
        <option value="ex1" data-en="1. Self-holding circuit (start/stop)" data-de="1. Selbsthaltung (Start/Stopp)">1. Itsepitopiiri (käynnistys ja pysäytys)</option>
        <option value="ex2" data-en="2. Direct-on-line start with thermal overload relay" data-de="2. Direktanlauf mit Motorschutzrelais">2. Moottorin suora käynnistys ja lämpörele</option>
        <option value="ex3" data-en="3. Reversing with interlocking" data-de="3. Wendeschaltung mit Verriegelung">3. Suunnanvaihto ja ristiinlukitus</option>
        <option value="ex4" data-en="4. Star–delta start" data-de="4. Stern-Dreieck-Anlauf">4. Tähti–kolmiokäynnistys</option>
        <option value="ex5" data-en="5. On-delay and off-delay timers" data-de="5. Anzugs- und abfallverzögerte Zeitrelais">5. Vetoviive- ja päästöviiverele</option>
        <option value="ex6" data-en="6. Electro-pneumatics: automatic return" data-de="6. Elektropneumatik: automatischer Rückhub">6. Sähköpneumatiikka: automaattinen paluu</option>
        <option value="ex7" data-en="7. Sequence A+ B+ A− B−" data-de="7. Ablauf A+ B+ A− B−">7. Sekvenssi A+ B+ A− B−</option>
        <option value="ex8" data-en="8. Emergency stop with a safety relay" data-de="8. Not-Halt mit Sicherheitsschaltgerät">8. Hätäseis ja turvarele</option>
        <option value="ex9" data-en="9. PLC: start and stop" data-de="9. SPS: Start und Stopp">9. PLC: käynnistys ja pysäytys</option>
        <option value="ex10" data-en="10. PLC: flasher and counter" data-de="10. SPS: Blinker und Zähler">10. PLC: vilkkuvalo ja laskuri</option>
        <option value="ex11" data-en="11. PLC: step sequence A+ B+ A− B−" data-de="11. SPS: Schrittkette A+ B+ A− B−">11. PLC: askelketju A+ B+ A− B−</option>
      </select>
      <button class="btn" id="undoBtn" type="button" title="Ctrl+Z" data-en="Undo" data-de="Rückgängig">Kumoa</button>
      <button class="btn" id="ioBtn" type="button" data-en="Save / load" data-de="Speichern / Laden">Tallenna / lataa</button>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
/* ---------- kieli / language ---------- */
const LANGS=['fi','en','de'];
let lang=(()=>{try{const u=new URLSearchParams(location.search).get('lang');if(LANGS.includes(u))return u;const st=localStorage.getItem('autsim-lang');if(LANGS.includes(st))return st;}catch(e){}
  const n=(navigator.language||'fi').toLowerCase();return n.startsWith('fi')?'fi':n.startsWith('de')?'de':'en';})();
const DEN={"Contact": "Kontakt", "Normally open (NO)": "Schließer (NO)", "Normally closed (NC)": "Öffner (NC)", "Rated voltage": "Bemessungsspannung", "Fault": "Fehler", "No fault": "Kein Fehler", "Welded (stays closed)": "Verschweißt (bleibt geschlossen)", "Does not conduct (worn)": "Leitet nicht (verschlissen)", "Coil open circuit": "Spule unterbrochen", "Front end (extended)": "Vordere Endlage (ausgefahren)", "Rear end (retracted)": "Hintere Endlage (eingefahren)", "Actuator": "Betätigt durch", "Manual (click)": "Von Hand (Klick)", "Position": "Stellung", "DC power supply": "Gleichspannungs-Netzteil", "Voltage": "Spannung", "AC supply 230 V": "Wechselspannung 230 V", "Three-phase supply 400 V": "Drehstrom 400 V", "Line voltage": "Außenleiterspannung", "Junction": "Verbindungspunkt", "Push button": "Taster", "Action": "Betätigungsart", "Momentary (spring return)": "Tastend (Federrückstellung)", "Latching": "Rastend", "Selector switch": "Wahlschalter", "Emergency stop": "Not-Halt", "Channel 1 (11–12) welded": "Kanal 1 (11–12) verschweißt", "Channel 2 (21–22) welded": "Kanal 2 (21–22) verschweißt", "Limit switch": "Positionsschalter", "Reed switch": "Reedschalter", "Proximity sensor (3-wire)": "Näherungsschalter (3-Leiter)", "Type": "Typ", "Inductive": "Induktiv", "Capacitive": "Kapazitiv", "Optical": "Optisch", "Output": "Ausgang", "PNP (switches +)": "PNP (plusschaltend)", "NPN (switches 0 V)": "NPN (minusschaltend)", "Output function": "Schaltfunktion", "Output stuck on": "Ausgang dauerhaft durchgeschaltet", "Output never switches": "Ausgang schaltet nie", "Relay / contactor (coil)": "Relais / Schütz (Spule)", "Control relay (10 ms)": "Hilfsrelais (10 ms)", "Contactor (25 ms)": "Schütz (25 ms)", "Timer relay": "Zeitrelais", "Function": "Funktion", "On-delay": "Anzugsverzögert", "Off-delay": "Abfallverzögert", "Set time T": "Einstellzeit T", "Solenoid valve coil": "Magnetventilspule", "Cylinder": "Zylinder", "Drives": "Steuert", "Out (+)": "Aus (+)", "Indicator lamp": "Meldeleuchte", "Colour": "Farbe", "Green": "Grün", "Red": "Rot", "Yellow": "Gelb", "White": "Weiß", "Blue": "Blau", "Auxiliary contact": "Hilfskontakt", "Belongs to": "Gehört zu", "Contact number (1st digit)": "Ordnungsziffer (1. Ziffer)", "Contactor main contacts": "Hauptkontakte des Schützes", "Belongs to contactor": "Gehört zu Schütz", "Pole 1–2 welded": "Pol 1–2 verschweißt", "All poles welded": "Alle Pole verschweißt", "Thermal overload relay": "Motorschutzrelais (thermisch)", "Current setting Ir": "Stromeinstellung Ir", "Reset": "Rückstellung", "Automatic": "Automatisch", "Motor protection switch": "Motorschutzschalter", "Initial state": "Anfangszustand", "Off": "Aus", "Induction motor 3~": "Drehstrom-Asynchronmotor 3~", "Rated current In": "Bemessungsstrom In", "Acceleration time (direct-on-line)": "Hochlaufzeit (Direktanlauf)", "Load": "Last", "Rated load (100 %)": "Bemessungslast (100 %)", "Overload (200 %)": "Überlast (200 %)", "Locked rotor": "Blockierter Läufer", "Induction motor 3~ (6 terminals, Y/Δ)": "Drehstrom-Asynchronmotor 3~ (6 Anschlüsse, Y/Δ)", "Rated current In (delta)": "Bemessungsstrom In (Dreieck)", "Acceleration time (delta)": "Hochlaufzeit (Dreieck)", "Pneumatic cylinder and 5/2 valve": "Pneumatikzylinder mit 5/2-Wegeventil", "Valve": "Ventil", "Monostable (spring return)": "Monostabil (Federrückstellung)", "Bistable (two solenoids)": "Bistabil (zwei Magnetspulen)", "Stroke time out": "Ausfahrzeit", "Stroke time in": "Einfahrzeit", "Safety relay": "Sicherheitsschaltgerät", "Start": "Start", "Monitored (reset, falling edge)": "Überwacht (Reset, fallende Flanke)", "PLC (programmable logic controller)": "SPS (speicherprogrammierbare Steuerung)", "Cycle time": "Zykluszeit", "Select": "Auswählen", "Wire": "Leitung", "Normally open contact (NO)": "Schließer (NO)", "Normally closed contact (NC)": "Öffner (NC)", "Rising edge": "Steigende Flanke", "Falling edge": "Fallende Flanke", "Coil": "Spule", "On-delay TON": "Einschaltverzögerung TON", "Off-delay TOF": "Ausschaltverzögerung TOF", "Up counter CTU": "Vorwärtszähler CTU", "Vertical link (branch)": "Senkrechte Verbindung (Verzweigung)", "Delete": "Löschen", "Supplies": "Versorgung", "Control devices": "Befehlsgeräte", "Sensors": "Sensoren", "Relays and logic": "Relais und Logik", "Protective devices": "Schutzgeräte", "Actuators": "Aktoren"};
const tr=(fi,en,de)=>lang==='en'?en:lang==='de'?(de??DEN[en]??en):fi;
const L2=a=>Array.isArray(a)?(lang==='en'?a[1]:lang==='de'?(a[2]??DEN[a[1]]??a[1]):a[0]):a;      // [fi, en] → current language

/* ---------- vakiot ja apufunktiot ---------- */
const DT=1e-3;                       // aika-askel 1 ms
const TAU_TH=100;                    // lämpöreleen ja moottorinsuojakytkimen lämpenemisaikavakio (s)

const H_RESET=1.2;                   // palautus sallittu, kun lämpötila on laskenut tämän alle
const SQ3=Math.sqrt(3);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const nf=(x,d=1)=>Number.isFinite(x)?(Math.abs(x)<0.5*Math.pow(10,-d)?0:x).toLocaleString(({fi:'fi-FI',en:'en-US',de:'de-DE'})[lang],{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:false}):'–';
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const fs=x=>`${nf(x,x<10?2:1)} s`;

/* ---------- symbolien apufunktiot ---------- */
const r1=v=>Math.round(v*10)/10;
const L=(x1,y1,x2,y2,c='sy')=>`<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" class="${c}"/>`;
const TXT=(x,y,s,c='sym',a='middle')=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${s}</text>`;
const RECT=(x,y,w,h,c='syf')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${c}"/>`;
const CIRC=(x,y,r,c='syf')=>`<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`;
/* pystysuuntainen kosketin sarakkeessa cx, liitännät y = ±30 */
const C_NO_ST=cx=>L(cx,-30,cx,-12)+L(cx,12,cx,30);
const C_NO_DY=(cx,on)=>on?L(cx,12,cx,-12,'sy hotl'):L(cx,12,cx-11,-10);
const C_NC_ST=cx=>L(cx,-30,cx,-12)+L(cx,-12,cx+9,-12)+L(cx,12,cx,30);
const C_NC_DY=(cx,on)=>on?L(cx,12,cx+9,-12,'sy hotl'):L(cx,12,cx-9,-10);
const C_ST=(no,cx=0)=>no?C_NO_ST(cx):C_NC_ST(cx);
const C_DY=(no,on,cx=0)=>no?C_NO_DY(cx,on):C_NC_DY(cx,on);
const LINK=(x1,x2,y=0)=>L(x1,y,x2,y,'sy dash');
/* käyttölaitteet kosketinsymbolin vasemmalla puolella */
const ACT_PUSH=(x=-24,p=false)=>{const d=p?4:0;return L(x+d,-6,x+d,6)+L(x+d,-6,x+d-4,-6)+L(x+d,6,x+d-4,6);};
const ACT_TURN=(x=-24)=>L(x-4,-6,x,-6)+L(x,-6,x,6)+L(x,6,x+4,6);
const ACT_ROLL=(x=-24)=>CIRC(x-4,0,4)+L(x,0,x+2,0);
const ACT_MAG=(x=-24)=>`<polygon class="syf" points="${x-10},0 ${x-5},-5 ${x},0 ${x-5},5"/>`;
const COIL=(on,extra='')=>L(0,-30,0,-9)+L(0,9,0,30)+`<rect x="-13" y="-9" width="26" height="18" class="${on?'cond':'syf'}"/>`+extra;

/* ---------- mallin tila ---------- */
let comps=[],wires=[],traces=[],byId={},nextId=1,simT=0,running=true,speed=1,showRead=true,tool='sel',sel=null;
const view={tx:0,ty:0,k:1};
let S={groups:null,key:''};

/* ---------- parametrimääritysten apurit ---------- */
const P=(k,l,u,min,max,st,o={})=>Object.assign({k,l,u,min,max,st},o);
const SEL=(k,l,opts,o={})=>Object.assign({k,l,sel:opts},o);
const REF=(k,l,types,o={})=>Object.assign({k,l,ref:types},o);
const KOSK=SEL('kosk',['Kosketin','Contact'],[['NO','Sulkeutuva (NO)','Normally open (NO)'],['NC','Avautuva (NC)','Normally closed (NC)']]);
const UN=(def)=>SEL('Un',['Nimellisjännite','Rated voltage'],[['24','24 V DC','24 V DC'],['230','230 V AC','230 V AC'],['400','400 V AC','400 V AC']]);
const VIKA_C=SEL('vika',['Vika','Fault'],[['ei','Ei vikaa','No fault'],['kiinni','Hitsautunut (jää kiinni)','Welded (stays closed)'],['auki','Ei johda (kulunut)','Does not conduct (worn)']]);
const VIKA_K=SEL('vika',['Vika','Fault'],[['ei','Ei vikaa','No fault'],['katkos','Kela katkennut','Coil open circuit']]);

const ACTP=[REF('ref',['Toimilaite','Actuator'],['cyl'],{none:['Käsiohjaus (klikkaus)','Manual (click)']}),
  SEL('asema',['Asento','Position'],POS,{show:c=>!!c.p.ref})];
const swLab=(no,a)=>no?(a?'13':'14'):(a?'11':'12');

/* kosketinnumerot: rele NO n3–n4, NC n1–n2; aikarele NO n7–n8, NC n5–n6; lämpörele NC 95–96, NO 97–98 */
function cNum(c,first){const p=c.p,no=p.kosk==='NO',r=refComp(c),n=p.nro||1;
  if(r&&r.type==='ol')return no?(first?'97':'98'):(first?'95':'96');
  if(r&&r.type==='kt')return no?`${n}${first?7:8}`:`${n}${first?5:6}`;
  return no?`${n}${first?3:4}`:`${n}${first?1:2}`;}
function refComp(c){const r=c.p.ref;if(!r)return null;return comps.find(x=>x.label===r&&TY[x.type].actor)||comps.find(x=>x.label===r&&x.type==='cyl')||null;}

/* ---------- komponenttityypit ----------
   ports: liitännät paikalliskoordinaateissa (ruudukko 10 px), d = suunta, josta johdin lähtee.

   loads(c): kuormat [liitäntä, liitäntä, nimellisjännite] — kuorma toimii, kun jännite ≥ 0,7·Un. */
const TY={
dc:{name:['DC-teholähde','DC power supply'],px:'G',bb:[-20,-40,20,40],src:1,
  ports:[{n:'p',lab:'+',x:0,y:-40,d:[0,-1]},{n:'n',lab:'0V',x:0,y:40,d:[0,1]}],
  prm:[P('U',['Jännite','Voltage'],'V',1,1000,1)],def:{U:24},init:()=>({trip:false}),
  terms:c=>[['p',{re:c.p.U,im:0},'+'],['n',{re:0,im:0},'0']],
  draw:c=>L(0,-40,0,-16)+L(0,16,0,40)+RECT(-18,-16,36,32)+TXT(0,-2,`${nf(c.p.U,0)} V`,'syms')+L(-7,7,7,7)+L(-7,11,7,11,'sy dash'),
  dyn:c=>c.st.trip?TXT(0,30,'!','sym'):'',

ac:{name:['AC-syöttö 230 V','AC supply 230 V'],px:'G',bb:[-20,-40,20,40],src:1,
  ports:[{n:'L',lab:'L',x:0,y:-40,d:[0,-1]},{n:'N',lab:'N',x:0,y:40,d:[0,1]}],
  prm:[P('U',['Jännite','Voltage'],'V',1,1000,1)],def:{U:230},init:()=>({trip:false}),
  terms:c=>[['L',{re:c.p.U,im:0},'+'],['N',{re:0,im:0},'0']],
  draw:c=>L(0,-40,0,-16)+L(0,16,0,40)+CIRC(0,0,16)+TXT(0,-3,`${nf(c.p.U,0)} V`,'syms')+`<path class="sy" d="M-6,8 q3,-5 6,0 t6,0"/>`,
  dyn:c=>c.st.trip?TXT(0,30,'!','sym'):'',
  hit:()=>'k',click:c=>{c.st.trip=false;},
  read:c=>c.st.trip?tr('LAUENNUT','TRIPPED','AUSGELÖST'):''},

  ports:[{n:'L1',lab:'L1',x:-30,y:30,d:[0,1]},{n:'L2',lab:'L2',x:0,y:30,d:[0,1]},{n:'L3',lab:'L3',x:30,y:30,d:[0,1]},{n:'N',lab:'N',x:60,y:30,d:[0,1]}],
  prm:[P('U',['Pääjännite','Line voltage'],'V',1,1000,1)],def:{U:400},init:()=>({trip:false}),

  draw:c=>RECT(-44,-18,118,30)+TXT(15,2,`3~ ${nf(c.p.U,0)} V 50 Hz`,'syms')+L(-30,12,-30,30)+L(0,12,0,30)+L(30,12,30,30)+L(60,12,60,30),
  dyn:c=>c.st.trip?TXT(66,-4,'!','sym'):'',
  hit:()=>'k',click:c=>{c.st.trip=false;},

jn:{name:['Kytkentäpiste','Junction'],px:'X',bb:[-6,-6,6,6],ports:[{n:'0',x:0,y:0,d:[0,0]}],prm:[],def:{},init:()=>({}),
  draw:()=>CIRC(0,0,3.5,'fi')},

  prm:[KOSK,SEL('toim',['Toiminta','Action'],[['palautuva','Palautuva (jousi)','Momentary (spring return)'],['lukittuva','Lukittuva','Latching']]),VIKA_C],

/* toimilaitteen (rele, aikarele, lämpörele, moottorinsuojakytkin) asento koskettimille */
function actorOn(r){if(!r)return false;if(r.type==='k'||r.type==='kt')return r.st.on;if(r.type==='ol')return r.st.trip;if(r.type==='qm')return r.st.on;return false;}
/* pakko-ohjatut koskettimet / peilikoskettimet: jos jokin releen sulkeutuva kosketin tai pääkosketin on hitsautunut,
   avautuvat koskettimet eivät sulkeudu (EN 50205, IEC 60947-4-1 liite F) */
function weldedNO(r){return comps.some(x=>x.p&&x.p.ref===r.label&&((x.type==='kc'&&x.p.kosk==='NO'&&x.p.vika==='kiinni')||(x.type==='km'&&x.p.vika!=='ei')));}
function contactClosed(c){const r=refComp(c);let on=actorOn(r);const no=c.p.kosk==='NO';
  if(!no&&r&&(r.type==='k')&&weldedNO(r))on=true;
  return cState(c,no?on:!on);}
function sensed(c){const r=c.p.ref?comps.find(x=>x.label===c.p.ref&&x.type==='cyl'):null;
  if(!r)return !!c.st.on;return c.p.asema==='etu'?r.st.x>=0.999:r.st.x<=0.001;}
function proxOut(c){if(c.p.vika==='kiinni')return !!c.st.pw;if(c.p.vika==='auki'||!c.st.pw)return false;const a=sensed(c);return c.p.kosk==='NO'?a:!a;}
function sensRead(c){if(c.p.ref)return `${c.p.ref} ${c.p.asema==='etu'?tr('etu','front','vorn'):tr('taka','rear','hinten')}`;return sensed(c)?tr('tunnistaa','detecting','erkennt'):'';}
function xref(c){const cs=comps.filter(x=>x.p&&x.p.ref===c.label&&(x.type==='kc'||x.type==='km'));
  return cs.map(x=>x.type==='km'?'1–6':`${cNum(x,1)}–${cNum(x,0)}`).join(' · ');}
function cylRead(c){const x=c.st.x;if(x>=0.999)return tr('ulkona','extended','ausgefahren');if(x<=0.001)return tr('sisällä','retracted','eingefahren');return `${nf(x*100,0)} %`;}
function motRead(c){const s=c.st;if(Math.abs(s.n)<1&&!s.I)return '';return `${nf(Math.abs(s.n),0)} ${tr('r/min','rpm','1/min')}${s.conn==='Y'?' Y':s.conn==='D'?' Δ':''} · ${nf(s.I,1)} A`;}
function motDyn(c){const s=c.st,a=s.ang||0;let h=`<circle cx="${r1(17*Math.cos(a))}" cy="${r1(17*Math.sin(a))}" r="2.6" class="fi"/>`;
  if(s.dir)h+=`<path class="mot" d="M${s.dir>0?'-9,-30 A30,30 0 0 1 9,-30':'9,-30 A30,30 0 0 0 -9,-30'}"/>`;return h;}
function srLock(k){return {erivat:tr('kanavat eriävät','channels differ','Kanäle ungleich'),ristikko:tr('kanavien välinen oikosulku','cross short between channels','Querschluss zwischen den Kanälen')}[k]||k;}
function olReset(c){if(!c.st.trip)return;if(c.st.h>H_RESET){flashWarn(tr(`${c.label}: lämpörele on vielä kuuma, anna jäähtyä ennen palautusta.`,`${c.label}: the overload relay is still hot, let it cool down before reset.`,`${c.label}: Das Motorschutzrelais ist noch warm, vor dem Rückstellen abkühlen lassen.`));return;}c.st.trip=false;}

/* ---------- geometria ---------- */
function rotP(x,y,r){switch(((r%360)+360)%360){case 90:return[-y,x];case 180:return[-x,-y];case 270:return[y,-x];default:return[x,y];}}
const plab=(p,c)=>typeof p.lab==='function'?p.lab(c):p.lab;
function portsW(c){return TY[c.type].ports.map(p=>{const[x,y]=rotP(p.x,p.y,c.rot),[dx,dy]=rotP(p.d[0],p.d[1],c.rot);
  return {n:p.n,lab:plab(p,c),x:c.x+x,y:c.y+y,d:[Math.round(dx),Math.round(dy)],k:c.id+':'+p.n,c};});}
function bbW(c){const b=TY[c.type].bb,a=rotP(b[0],b[1],c.rot),d=rotP(b[2],b[3],c.rot);
  return [c.x+Math.min(a[0],d[0]),c.y+Math.min(a[1],d[1]),c.x+Math.max(a[0],d[0]),c.y+Math.max(a[1],d[1])];}
function portByKey(k){const i=k.indexOf(':');const c=byId[k.slice(0,i)];if(!c)return null;const pn=k.slice(i+1);return portsW(c).find(p=>p.n===pn)||null;}
function route(p1,p2){
  const s1={x:p1.x+p1.d[0]*10,y:p1.y+p1.d[1]*10},s2={x:p2.x+p2.d[0]*10,y:p2.y+p2.d[1]*10};
  const mx=(s1.x+s2.x)/2,my=(s1.y+s2.y)/2;
  const cands=[[{x:s2.x,y:s1.y}],[{x:s1.x,y:s2.y}],[{x:mx,y:s1.y},{x:mx,y:s2.y}],[{x:s1.x,y:my},{x:s2.x,y:my}]];
  let best=null,bc=Infinity;
  for(const mid of cands){const pts=[p1,s1,...mid,s2,p2];let cost=0,pd=null;
    for(let i=1;i<pts.length;i++){const dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y,l=Math.abs(dx)+Math.abs(dy);if(l<0.5)continue;
      const d=[Math.sign(dx),Math.sign(dy)];if(pd&&d[0]===-pd[0]&&d[1]===-pd[1])cost+=1000;cost+=l;if(pd&&(d[0]!==pd[0]||d[1]!==pd[1]))cost+=6;pd=d;}
    if(cost<bc){bc=cost;best=pts;}}
  return simplifyPts(best);
}
function simplifyPts(pts){
  const out=[{x:pts[0].x,y:pts[0].y}];
  for(let i=1;i<pts.length;i++){const a=out[out.length-1],p=pts[i];if(Math.abs(p.x-a.x)+Math.abs(p.y-a.y)>0.5)out.push({x:p.x,y:p.y});}
  for(let i=out.length-2;i>=1;i--){const a=out[i-1],b=out[i],c=out[i+1];
    if((Math.abs(a.x-b.x)<0.5&&Math.abs(b.x-c.x)<0.5)||(Math.abs(a.y-b.y)<0.5&&Math.abs(b.y-c.y)<0.5))out.splice(i,1);}
  return out;
}
function orthoPts(pts){
  const out=[pts[0]];
  for(let i=1;i<pts.length;i++){const a=out[out.length-1],p=pts[i];
    if(Math.abs(p.x-a.x)>0.5&&Math.abs(p.y-a.y)>0.5){const prevH=out.length>1&&Math.abs(out[out.length-2].y-a.y)<0.5;out.push(prevH?{x:a.x,y:p.y}:{x:p.x,y:a.y});}
    out.push(p);}
  return out;
}
function wirePts(w,a,b){if(!w.pts||!w.pts.length)return route(a,b);return simplifyPts(orthoPts([{x:a.x,y:a.y},...w.pts.map(p=>({x:p.x,y:p.y})),{x:b.x,y:b.y}]));}
const ptsD=pts=>'M'+pts.map(p=>`${r1(p.x)},${r1(p.y)}`).join('L');

/* ---------- piirin ratkaisu ----------
   Relelogiikka ratkaistaan johtavuustarkasteluna: johtimet ja suljetut koskettimet yhdistävät liitännät ryhmiksi
   (union–find). Kuorman (kela, lamppu, anturi) jännite on saman lähteen napojen potentiaalien erotus, jos kuorman
   liitännät ovat eri napojen ryhmissä. Kuorma toimii, kun jännite on vähintään 0,7·Un. Sarjaan kytketyt kuormat eivät
   toimi (kummallekin jää alle 0,7·Un). Aika-askel on 1 ms; releet, ajastimet, sylinterit ja moottorit päivittyvät
   askeleittain, joten kosketintilojen muutos näkyy piirissä seuraavalla askeleella. */
function rebuild(){
  const pk=[],pi={};
  for(const c of comps){c.pidx={};for(const p of TY[c.type].ports){const k=c.id+':'+p.n;pi[k]=pk.length;c.pidx[p.n]=pk.length;pk.push(k);}}
  const wE=[];for(const w of wires)if(!w.broken&&pi[w.a]!==undefined&&pi[w.b]!==undefined)wE.push(pi[w.a],pi[w.b]);
  S={np:pk.length,pk,pi,wE:Int32Array.from(wE),root:new Int32Array(pk.length),gT:new Map(),key:'',attr:new Map(),
     swc:comps.filter(c=>TY[c.type].sw),srcs:comps.filter(c=>TY[c.type].src),motors:comps.filter(c=>TY[c.type].motor),
     prot:comps.filter(c=>c.type==='ol'||c.type==='qm'),warn:{},short:[]};
  for(const c of comps)if(TY[c.type].contact)c.label=autoLabel(c);
  solveGroups();
}
function autoLabel(c){const r=c.p.ref||'?';return c.type==='km'?`${r}.1`:`${r}.${cNum(c,1)}`;}
function ufRoots(skip){
  const n=S.np,par=new Int32Array(n);for(let i=0;i<n;i++)par[i]=i;
  const f=i=>{while(par[i]!==i){par[i]=par[par[i]];i=par[i];}return i;};
  const u=(a,b)=>{a=f(a);b=f(b);if(a!==b)par[a]=b;};
  const E=S.wE;for(let i=0;i<E.length;i+=2)u(E[i],E[i+1]);
  let key='';
  for(const c of S.swc){const items=TY[c.type].sw(c);for(const [a,b,on] of items){key+=on?'1':'0';if(on&&!(skip&&skip===c))u(c.pidx[a],c.pidx[b]);}}
  const root=new Int32Array(n);for(let i=0;i<n;i++)root[i]=f(i);
  return {root,key};
}
function groupTerms(root){const G=new Map();
  for(const s of S.srcs){if(s.st.trip)continue;for(const [pn,v,tag] of TY[s.type].terms(s)){const r=root[s.pidx[pn]];if(!G.has(r))G.set(r,[]);G.get(r).push({s,v,tag});}}
  return G;}
function solveGroups(){const {root,key}=ufRoots(null);S.root=root;S.key=key;S.gT=groupTerms(root);
  S.srLive=new Set();for(const c of comps)if(c.type==='sr'&&c.st.pw)for(const pn of ['S11','S21','S33'])S.srLive.add(root[c.pidx[pn]]);}
const rootOf=(c,pn)=>S.root[c.pidx[pn]];
function vAcross(c,a,b,G=S.gT,root=S.root){const ra=root[c.pidx[a]],rb=root[c.pidx[b]];if(ra===rb)return 0;
  const A=G.get(ra),B=G.get(rb);if(!A||!B)return 0;let v=0;
  for(const x of A)for(const y of B)if(x.s===y.s){const d=Math.hypot(x.v.re-y.v.re,x.v.im-y.v.im);if(d>v)v=d;}
  return v;}
function phaseOf(c,pn,G=S.gT,root=S.root){const T=G.get(root[c.pidx[pn]]);if(!T)return null;const t=T.find(x=>x.s.type==='l3');return t?t.tag:null;}
/* oikosulkujen tunnistus: saman lähteen kaksi napaa samassa ryhmässä */
function shortedSources(root){const out=[];for(const s of S.srcs){if(s.st.trip)continue;const rs=TY[s.type].terms(s).map(([pn])=>root[s.pidx[pn]]);
  if(new Set(rs).size<rs.length)out.push(s);}return out;}

/* ---------- aika-askel ---------- */
const togg=[];   // releiden tilanmuutosten ajat (värähtelyn tunnistus)
function stepSim(){
  const t=simT+DT;
  solveGroups();
  /* oikosulut */
  const sh=shortedSources(S.root);
  if(sh.length){for(const s of sh){
      if(s.type==='l3'){let done=false;
        for(const q of S.prot)if(q.type==='qm'&&q.st.on){const r=ufRoots(q).root;if(!shortedSources(r).includes(s)){q.st.on=false;q.st.trip=true;q.st.why='oikosulku';done=true;break;}}
        if(!done){s.st.trip=true;s.st.why='oikosulku';}}
      else{s.st.trip=true;s.st.why='oikosulku';}}
    solveGroups();}
  /* kuormat */
  for(const c of comps){const ty=c.type,p=c.p;
    if(ty==='k'||ty==='kt'||ty==='y'||ty==='lamp'){const U=vAcross(c,TY[ty].ports[0].n,TY[ty].ports[1].n),Un=+p.Un;
      c.st.U=U;c.st.over=U>1.3*Un;const e=U>=0.7*Un&&p.vika!=='katkos';
      if(ty==='k'){c.st.e=e;const d=p.laji==='kontaktori'?0.025:0.010;
        if(e!==c.st.on){c.st.tc+=DT;if(c.st.tc>=d-1e-9){c.st.on=e;c.st.tc=0;togg.push(t);}}else c.st.tc=0;}
      else if(ty==='kt'){c.st.e=e;
        if(p.toim==='veto'){if(e){c.st.te+=DT;if(!c.st.on&&c.st.te>=p.T-1e-9){c.st.on=true;togg.push(t);}}else{if(c.st.on)togg.push(t);c.st.te=0;c.st.on=false;}c.st.tc=e&&!c.st.on?c.st.te:0;}
        else{if(e){if(!c.st.on)togg.push(t);c.st.on=true;c.st.te=0;}else if(c.st.on){c.st.te+=DT;if(c.st.te>=p.T-1e-9){c.st.on=false;togg.push(t);}}c.st.tc=!e&&c.st.on?c.st.te:0;}}
      else c.st.e=e;}
    else if(ty==='prox'){const U=vAcross(c,'bn','bu');c.st.pw=U>=10;c.st.U=U;}
    else if(ty==='sr')srStep(c);
    else if(ty==='plc')plcStep(c);}
  /* sylinterit */
  for(const c of comps)if(c.type==='cyl'){const ys=comps.filter(y=>y.type==='y'&&y.p.ref===c.label);
    const plus=ys.some(y=>y.st.e&&y.p.suunta==='plus'),minus=ys.some(y=>y.st.e&&y.p.suunta==='miinus');
    if(c.p.venttiili==='mono')c.st.dir=plus?1:-1;else{if(plus&&!minus)c.st.dir=1;else if(minus&&!plus)c.st.dir=-1;}
    c.st.both=plus&&minus;
    if(c.st.dir>0)c.st.x=Math.min(1,c.st.x+DT/c.p.tout);else c.st.x=Math.max(0,c.st.x-DT/c.p.tin);}
  /* moottorit ja suojalaitteet */
  for(const m of S.motors)motorStep(m);
  if(S.prot.length){let A=S.attr.get(S.key);if(!A){A=attribution();if(S.attr.size>200)S.attr.clear();S.attr.set(S.key,A);}
    for(const q of S.prot){let I=0;for(const id of A[q.id]||[]){const m=byId[id];if(m&&m.st.I>I)I=m.st.I;}q.st.I=I;
      const r=I/q.p.Ir;q.st.h+=DT*(r*r-q.st.h)/TAU_TH;if(q.st.h<0)q.st.h=0;
      if(q.type==='ol'){if(!q.st.trip&&q.st.h>=H_TRIP)q.st.trip=true;else if(q.st.trip&&q.p.pal==='auto'&&q.st.h<H_RESET)q.st.trip=false;}
      else if(q.st.on&&q.st.h>=H_TRIP){q.st.on=false;q.st.trip=true;q.st.why='ylikuorma';}}}
  while(togg.length&&togg[0]<t-1)togg.shift();
  simT=t;
  if(Math.round(t/DT)%10===0)recordTraces(t);
}
/* moottorin syöttö: mitkä moottorit saavat syöttönsä kunkin lämpöreleen / moottorinsuojakytkimen kautta */
function attribution(){const A={};const cnt=(m,G,root)=>TY[m.type].ports.filter(p=>phaseOf(m,p.n,G,root)).length;
  for(const q of S.prot){A[q.id]=[];const {root}=ufRoots(q);const G=groupTerms(root);
    for(const m of S.motors)if(cnt(m,S.gT,S.root)>cnt(m,G,root))A[q.id].push(m.id);}
  return A;}
const PERM={'L1L2L3':1,'L2L3L1':1,'L3L1L2':1,'L1L3L2':-1,'L3L2L1':-1,'L2L1L3':-1};
function motorStep(m){const s=m.st,p=m.p;const ph=n=>phaseOf(m,n);const LIVE=x=>x==='L1'||x==='L2'||x==='L3';
  const p1=['U1','V1','W1'].map(ph);let mode='off',conn='',dir=0,why='';
  const three=p1.every(LIVE)&&new Set(p1).size===3,two=new Set(p1.filter(LIVE)).size===2&&p1.filter(LIVE).length===2;
  if(m.type==='mot'){if(three){mode='full';dir=PERM[p1.join('')];}else if(two)mode='kaksi';}
  else{const p2=['U2','V2','W2'].map(ph);const r2=['U2','V2','W2'].map(n=>rootOf(m,n));
    const sp=r2[0]===r2[1]&&r2[1]===r2[2]&&p2.every(x=>!x);
    if(three){
      if(sp){mode='full';conn='Y';dir=PERM[p1.join('')];}
      else if(p2.every(LIVE)&&new Set(p2).size===3&&p2.every((x,i)=>x!==p1[i])){mode='full';conn='D';dir=PERM[p1.join('')];}
      else if(p2.every(x=>!x)){why='avoin';}
      else why='virhe';}
    else if(two)mode=sp||p2.some(LIVE)?'kaksi':'off';}
  const ns=1500,Ist=conn==='Y'?2:6,lf=p.kuorma==='ylikuorma'?2:1,ta=p.ta*(conn==='Y'?3:1);
  let n=s.n,I=0;
  if(mode==='full'){const nt=p.kuorma==='jumissa'?0:dir*(conn==='Y'?1420:1450);const a=ns/ta*DT;n=Math.abs(nt-n)<=a?nt:n+Math.sign(nt-n)*a;
    const sl=clamp((dir*ns-n)/ns,0,1),s0=1-(conn==='Y'?1420:1450)/ns;I=p.In*(lf+(Ist-lf)*clamp((sl-s0)/Math.max(1-s0,1e-6),0,1));}
  else if(mode==='kaksi'){if(Math.abs(n)>100){const nt=Math.sign(n)*1300;n+=clamp(nt-n,-ns/p.ta*DT,ns/p.ta*DT);I=p.In*lf*1.73;}else{n+=clamp(-n,-ns*DT,ns*DT);I=p.In*5;}why='kaksi';}
  else{n+=clamp(-n,-750*DT,750*DT);}
  s.n=n;s.I=I;s.dir=mode==='full'?dir:0;s.conn=conn;s.why=why;s.mode=mode;
  s.ang=((s.ang||0)+Math.sign(n)*Math.min(Math.abs(n),1500)/1500*7*DT)%(2*Math.PI);
}
/* turvarele: kaksikanavainen hätäseispiiri (S11–S12, S21–S22), kuittaus S33–S34 */
function srStep(c){const s=c.st,p=c.p;const same=(a,b)=>rootOf(c,a)===rootOf(c,b);
  const U=vAcross(c,'A1','A2');s.U=U;s.pw=U>=0.7*24;
  if(!s.pw){s.out=false;s.lock='';s.pr=false;s.c1=s.c2=false;return;}
  const c1=same('S11','S12'),c2=same('S21','S22'),cross=same('S11','S21')||same('S12','S22');
  s.c1=c1;s.c2=c2;const reset=same('S33','S34');
  if(cross){s.out=false;s.lock='ristikko';}
  const both=c1&&c2,none=!c1&&!c2;
  if(s.out&&!both)s.out=false;
  if(c1!==c2&&!s.lock)s.lock='erivat';
  if(!s.out&&s.lock==='erivat'&&none)s.lock='';
  if(s.lock==='ristikko'&&!cross&&none)s.lock='';
  if(!s.out&&both&&!s.lock&&!cross){if(p.kayn==='auto'?reset:(s.pr&&!reset))s.out=true;}
  s.pr=reset;}

/* ---------- PLC ----------
   Ohjelmoitava logiikka: syöttö L+ ja M (24 V DC), 8 digitaalituloa I0.0–I0.7 (tulo on 1, kun sen jännite M:ää vasten
   on vähintään 15 V), 8 lähtöä Q0.0–Q0.7 (PNP-tyyppinen lähtö kytkee L+:n lähtöliitäntään). Ohjelma on tikapuukaavio
   (LD, IEC 61131-3): askeleet suoritetaan järjestyksessä kerran kierrossa (oletus 10 ms). Kierron alussa tulot luetaan
   prosessikuvaan, lopussa lähdöt kirjoitetaan. Operandit: I, Q, M (M0.0–M3.7), ajastimet T0–T15 ja laskurit C0–C15. */
const LD_COLS=7, LD_ROWS=4;
const LD_OUT=['coil','s','r','ton','tof','ctu'];
const LD_CONTACT=['no','nc','p','n'];
function newRung(rows=1){return {k:'',rows,cells:Array.from({length:LD_ROWS},()=>Array(LD_COLS+1).fill(null)),v:Array.from({length:LD_ROWS},()=>Array(LD_COLS+1).fill(false))};}
function newProg(){return {rungs:[newRung()]};}
const ADDR_RE=/^([IQM])(\d)\.([0-7])$|^([TC])(\d{1,2})$/;
function parseAddr(a){const m=ADDR_RE.exec(String(a||'').trim().toUpperCase());if(!m)return null;
  if(m[1]){const by=+m[2],bi=+m[3],i=by*8+bi;if((m[1]==='I'||m[1]==='Q')&&i>7)return null;if(m[1]==='M'&&i>31)return null;return {k:m[1],i,s:`${m[1]}${by}.${bi}`};}
  const n=+m[5];if(n>15)return null;return {k:m[4],i:n,s:`${m[4]}${n}`};}
function plcInit(){return {run:true,pw:false,U:0,acc:0,I:Array(8).fill(false),Q:Array(8).fill(false),M:Array(32).fill(false),T:{},C:{},E:{},view:null,scans:0};}
function plcGet(s,a){const p=parseAddr(a);if(!p)return false;
  switch(p.k){case 'I':return s.I[p.i];case 'Q':return s.Q[p.i];case 'M':return s.M[p.i];
    case 'T':return !!(s.T[p.i]&&s.T[p.i].q);case 'C':return !!(s.C[p.i]&&s.C[p.i].q);}return false;}

let lastTs=null,frame=0,simRate=0,rateAcc=0,rateT=0;
function loop(ts){
  const fdt=lastTs===null?0:Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;
  if(running&&comps.length){const t0=performance.now(),want=speed*fdt;const n=Math.round(want/DT);let done=0;const tStart=simT;
    while(done<n){const m=Math.min(50,n-done);for(let i=0;i<m;i++)stepSim();done+=m;if(performance.now()-t0>14)break;}
    rateAcc+=simT-tStart;rateT+=fdt;if(rateT>0.5){simRate=rateAcc/rateT;rateAcc=0;rateT=0;}}
  render();requestAnimationFrame(loop);
}
function render(){
  frame++;
  for(const c of comps){const t=TY[c.type];if(t.dyn){const s=t.dyn(c);if(s!==c.dyS){c.dyEl.innerHTML=s;c.dyS=s;}}}
  if(frame%3===0)for(const w of wires){if(!w.bp)continue;const [col,live]=wireColour(w);w.bp.setAttribute('stroke',col);w.bp.setAttribute('stroke-width',live?3:2);}
  if(frame%4===0)for(const c of comps){const r=showRead&&TY[c.type].read?TY[c.type].read(c):'';if(c.rt.textContent!==r)c.rt.textContent=r;}
  if(frame%2===0&&tdTab==='td')drawTD();
  if(frame%5===0)refreshLDOnline();
  if(frame%10===0)updDer();
  if(frame%20===0)updWarns();
  $('#simTime').textContent=`t = ${nf(simT,simT<100?2:1)} s`;
  if(frame%15===0){const st=$('#simTime');st.title=tr(`Simulointinopeus ${nf(simRate,2)} s/s, aika-askel 1 ms`,`Simulation rate ${nf(simRate,2)} s/s, time step 1 ms`,`Simulationsgeschwindigkeit ${nf(simRate,2)} s/s, Zeitschritt 1 ms`);}
}

      :W(`${lb}: oikosulku, teholähteen suojaus laukesi. Korjaa kytkentä ja kuittaa klikkaamalla lähdettä.`,`${lb}: short circuit, the power supply protection tripped. Correct the wiring and reset by clicking the supply.`,`${lb}: Kurzschluss, der Schutz des Netzteils hat ausgelöst. Korrigieren Sie die Verdrahtung und setzen Sie durch Klick auf die Versorgung zurück.`,'','oikosulku');

      :W(`${lb}: ylikuorma, moottorinsuojakytkin laukesi. Kytke uudelleen klikkaamalla, kun kytkin on jäähtynyt.`,`${lb}: overload, the motor protection switch tripped. Switch on again by clicking when it has cooled down.`,`${lb}: Überlast, der Motorschutzschalter hat ausgelöst. Nach dem Abkühlen per Klick wieder einschalten.`,'','qm_ylikuorma');
    if(c.type==='ol'&&s.trip)W(`${lb}: lämpörele laukesi (ylikuorma). Apukoskettimet 95–96 aukesivat ja 97–98 sulkeutuivat. ${p.pal==='kasi'?'Palauta klikkaamalla, kun rele on jäähtynyt.':''}`,`${lb}: the overload relay tripped. Auxiliary contacts 95–96 opened and 97–98 closed. ${p.pal==='kasi'?'Reset by clicking when the relay has cooled down.':''}`,`${lb}: Das Motorschutzrelais hat ausgelöst (Überlast). Die Hilfskontakte 95–96 haben geöffnet und 97–98 geschlossen. ${p.pal==='kasi'?'Nach dem Abkühlen per Klick rückstellen.':''}`,'','lampo');
    if((c.type==='k'||c.type==='kt'||c.type==='y'||c.type==='lamp')&&s.over)W(`${lb}: jännite ${nf(s.U,0)} V ylittää nimellisjännitteen ${p.Un} V. Kela tai lamppu tuhoutuisi.`,`${lb}: voltage ${nf(s.U,0)} V exceeds the rated ${p.Un} V. The coil or lamp would be destroyed.`,`${lb}: Die Spannung ${nf(s.U,0)} V überschreitet die Bemessungsspannung ${p.Un} V. Spule oder Leuchte würden zerstört.`,'','ylijannite');

      if(s.why==='avoin')W(`${lb}: käämien toiset päät (U2, V2, W2) ovat kytkemättä: tähtipiste tai kolmiokytkentä puuttuu.`,`${lb}: the other winding ends (U2, V2, W2) are not connected: the star point or delta connection is missing.`,`${lb}: Die anderen Wicklungsenden (U2, V2, W2) sind nicht angeschlossen: Sternpunkt oder Dreieckschaltung fehlt.`,'','tahtipiste');

    if(c.type==='sr'&&s.lock)W(`${lb}: ${s.lock==='erivat'?'turvareleen kanavat eriävät (toinen kanava ei avautunut). Lähdöt pysyvät auki, kunnes molemmat kanavat on avattu ja vika korjattu.':'kanavien välinen oikosulku. Lähdöt pysyvät auki, kunnes vika on korjattu ja kanavat avattu.'}`,
      `${lb}: ${s.lock==='erivat'?'the safety relay channels differ (one channel did not open). The outputs stay open until both channels have been opened and the fault corrected.':'cross short between the channels. The outputs stay open until the fault is corrected and the channels opened.'}`,
      `${lb}: ${s.lock==='erivat'?'Die Kanäle des Sicherheitsschaltgeräts sind ungleich (ein Kanal hat nicht geöffnet). Die Ausgänge bleiben offen, bis beide Kanäle geöffnet und der Fehler behoben ist.':'Querschluss zwischen den Kanälen. Die Ausgänge bleiben offen, bis der Fehler behoben ist und die Kanäle geöffnet wurden.'}`,'','turvarele');
    if(c.type==='cyl'&&s.both)W(`${lb}: venttiilin molemmat kelat saavat ohjauksen yhtä aikaa (signaaliristiriita).`,`${lb}: both valve solenoids are energised at the same time (signal conflict).`,`${lb}: Beide Ventilmagnete werden gleichzeitig angesteuert (Signalüberschneidung).`,'','ristiriita');
    if((TY[c.type].contact||c.type==='y')&&!refComp(c))W(`${dispLabel(c)}: ${c.type==='y'?'sylinteriä':'kelaa tai laitetta'} ei ole valittu tai se puuttuu piiristä.`,`${dispLabel(c)}: the ${c.type==='y'?'cylinder':'coil or device'} is not selected or is missing from the circuit.`,`${dispLabel(c)}: ${c.type==='y'?'Der Zylinder':'Die Spule bzw. das Gerät'} ist nicht gewählt oder fehlt in der Schaltung.`,'','viite');}
  for(const c of comps)if(c.type==='plc'&&!c.st.pw)W(`${c.label}: PLC:llä ei ole syöttöä (L+ ja M 24 V).`,`${c.label}: the PLC has no supply (L+ and M 24 V).`,`${c.label}: Die SPS hat keine Versorgung (L+ und M 24 V).`,'','plc_syotto');
  if(togg.length>20)W('Rele värähtelee: rele katkaisee oman ohjauksensa (esimerkiksi avautuva kosketin oman kelan piirissä).','A relay oscillates: it interrupts its own control (for example a normally closed contact in its own coil circuit).','Ein Relais schwingt: Es unterbricht seine eigene Ansteuerung (zum Beispiel ein Öffner im eigenen Spulenstromkreis).','','varahtely');
  if(comps.length&&!S.srcs.length)W('Piirissä ei ole syöttöä. Lisää teholähde tai syöttö.','The circuit has no supply. Add a power supply.','Die Schaltung hat keine Versorgung. Fügen Sie ein Netzteil oder eine Versorgung hinzu.','info','syotto');
  if(!comps.length)W('Vedä komponentteja vasemmalta piirtoalustalle tai valitse esimerkkipiiri.','Drag components from the left onto the canvas or load an example circuit.','Ziehen Sie Bauteile von links auf die Zeichenfläche oder laden Sie eine Beispielschaltung.','info','tyhja');
  else if(!wires.length)W('Kytke komponentit vetämällä liitännästä toiseen.','Connect components by dragging from one terminal to another.','Verbinden Sie Bauteile, indem Sie von einem Anschluss zu einem anderen ziehen.','info','kytke');
  if(flashMsg&&performance.now()-flashT<4000)out.unshift([flashMsg,'info','ilmoitus']);else flashMsg=null;
  lastWarnCodes=out.map(o=>o[2]).filter(c=>c!=='ilmoitus');$('#warns').innerHTML=out.slice(0,4).map(([s,c])=>`<div class="${c}">${esc(s)}</div>`).join('');
}

function elSvg(el,x,y,on,sym,plc){const cx=x+CW/2,cy=y+RH/2,hot=on?' ldon':'';let h='';

function ldBoxTxt(el,plc){const p=parseAddr(el.a),s=plc&&plc.st;

function rungSvg(R,ri,plc){const n=R.rows,W=X0*2+(LD_COLS+1)*CW,H=n*RH+6;const V=plc&&plc.st.view&&plc.st.view[ri];const sel=LD.selCell;

  for(let r=0;r<n;r++){const y=r*RH+3;

function buildLD(){const el=$('#plcEd');if(!el||el.hidden)return;const plc=ldPlc();

    <button type="button" data-ldr="del" title="${tr('Poista askel','Delete rung','Netzwerk löschen')}">✕</button></div>${rungSvg(R,ri,plc)}</div>`;});

function newLabel(type){const pre=TY[type].px;if(!pre)return '';let i=1;while(comps.some(c=>c.label===pre+i))i++;return pre+i;}
function addComp(type,x,y,p={},opt={}){
  const c={id:opt.id||('c'+(nextId++)),type,x:Math.round(x/10)*10,y:Math.round(y/10)*10,rot:opt.rot||0,label:opt.label||newLabel(type),p:null,pu:JSON.parse(JSON.stringify(Object.assign({},TY[type].def,p)))};c.p=c.pu;
  if(type==='plc'&&!c.pu.prog)c.pu.prog=newProg();
  if(TY[type].contact&&!c.pu.ref){const k=comps.filter(x=>x.type==='k');if(k.length)c.pu.ref=k[k.length-1].label;}
  c.st=TY[type].init(c);comps.push(c);byId[c.id]=c;mkCompDom(c);return c;
}
function deleteSel(){
  if(!sel)return;snapshot();
  if(sel.w){wires=wires.filter(w=>w.id!==sel.w);}
  else for(const id of selIds()){const c=byId[id];c.el.remove();c.lbEl.remove();comps=comps.filter(x=>x.id!==id);delete byId[id];
    wires=wires.filter(w=>!w.a.startsWith(id+':')&&!w.b.startsWith(id+':'));
    traces=traces.filter(p=>p.target!==id);}
  sel=null;rebuild();syncAll();buildTDCtl();buildInsp();save();
}
let clip=null;
function copySel(){const ids=selIds();if(!ids.length)return false;const set=new Set(ids);
  clip={comps:ids.map(id=>{const c=byId[id];return {id,type:c.type,x:c.x,y:c.y,rot:c.rot,p:{...c.pu}};}),
    wires:wires.filter(w=>set.has(w.a.split(':')[0])&&set.has(w.b.split(':')[0])).map(w=>({a:w.a,b:w.b,pts:w.pts?w.pts.map(p=>({...p})):null})),n:0};
  flashWarn(tr(`Kopioitu ${ids.length} komponenttia. Liitä näppäimillä Ctrl+V.`,`Copied ${ids.length} components. Paste with Ctrl+V.`,`${ids.length} Bauteile kopiert. Mit Strg+V einfügen.`));return true;}
function pasteClip(){if(!clip)return;snapshot();clip.n++;const off=40*clip.n,map={};
  for(const c of clip.comps){const n=addComp(c.type,c.x+off,c.y+off,c.p,{rot:c.rot});map[c.id]=n.id;}
  const k=key=>{const i=key.indexOf(':');return map[key.slice(0,i)]+key.slice(i);};
  for(const w of clip.wires)wires.push({id:'w'+(nextId++),a:k(w.a),b:k(w.b),pts:w.pts?w.pts.map(p=>({x:p.x+off,y:p.y+off})):null});
  setSelIds(Object.values(map));rebuild();syncAll();buildInsp();save();}

function rotateSel(){if(!sel||!byId[sel.id])return;snapshot();const c=byId[sel.id];c.rot=(c.rot+90)%360;syncAll();save();}
function addWire(a,b){if(a===b)return;if(wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a)))return;snapshot();wires.push({id:'w'+(nextId++),a,b});rebuild();renderPorts();renderWires();save();}

function ser(){return JSON.stringify({v:1,app:'automaatiosimulaattori',comps:comps.map(c=>({id:c.id,type:c.type,x:c.x,y:c.y,rot:c.rot,label:c.label,p:c.pu})),

  traces:traces.map(x=>({target:x.target,col:x.col})),td:{win:TD.win}});}
function load(json,fit=true){
  const d=typeof json==='string'?JSON.parse(json):json;if(!d||!Array.isArray(d.comps))throw new Error(tr('Tiedostosta puuttuu komponenttilista.','The file has no component list.','Die Datei enthält keine Bauteilliste.'));
  lC.innerHTML='';lL.innerHTML='';comps=[];byId={};wires=[];traces=[];sel=null;nextId=1;
  for(const c of d.comps){if(!TY[c.type])continue;const n=parseInt(String(c.id).slice(1))||0;nextId=Math.max(nextId,n+1);const cp=Object.assign({ref:''},c.p);if(cp.prog&&cp.prog.rungs&&cp.prog.rungs.some(R=>Array.isArray(R.k))){cp.prog=JSON.parse(JSON.stringify(cp.prog));cp.prog.rungs.forEach(R=>{if(Array.isArray(R.k))R.k=L2(R.k);});}
    addComp(c.type,c.x,c.y,cp,{id:c.id,rot:c.rot,label:c.label});}
  for(const c of comps)if(!('ref' in TY[c.type].def))delete c.pu.ref;
  for(const w of d.wires||[])if(portByKey(w.a)&&portByKey(w.b))wires.push({id:'w'+(nextId++),a:w.a,b:w.b,broken:!!w.broken,pts:Array.isArray(w.pts)?w.pts.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)).map(p=>({x:p.x,y:p.y})):null});
  const used=new Set();
  for(const x of d.traces||[]){if(!byId[x.target]||traces.length>=8)continue;let col=Number.isInteger(x.col)&&!used.has(x.col)?x.col:[0,1,2,3,4,5,6,7].find(i=>!used.has(i));used.add(col);
    traces.push({id:'tr'+(nextId++),target:x.target,col});}
  TD.win=(d.td&&[2,5,10,20,30,60].includes(d.td.win))?d.td.win:10;setTDRun(true);
  resetStates();syncAll();buildTDCtl();buildInsp();if(typeof buildLD==='function')buildLD();if(fit)fitView();
}

function doUndo(){if(!undo.length)return;const s=undo.pop();load(s,false);save();}

function fitView(){
  const r=cv.getBoundingClientRect();if(!comps.length){view.k=1;view.tx=r.width/2;view.ty=r.height/2;applyView();return;}
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const c of comps){const b=bbW(c);const tall=!TY[c.type].wide&&(b[3]-b[1])>(b[2]-b[0])+4;x0=Math.min(x0,b[0]-(tall?(TY[c.type].src?70:30):0));x1=Math.max(x1,b[2]+(tall&&!TY[c.type].src?60:0));y0=Math.min(y0,b[1]-(tall?0:20));y1=Math.max(y1,b[3]+(tall?0:20));}
  for(const w of wires)for(const p of w.pts||[]){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
  const padT=56,padB=46,padX=24;const k=clamp(Math.min((r.width-2*padX)/(x1-x0+40),(r.height-padT-padB)/(y1-y0+40)),0.3,1.5);
  view.k=k;view.tx=(r.width-(x1+x0)*k)/2;view.ty=padT+((r.height-padT-padB)-(y1+y0)*k)/2;applyView();
}

/* PLC-ohjelmien apufunktio: RG(kommentti, rivejä, [[rivi, sarake, tyyppi, osoite, lisä]], pystyyhteydet [[rivi, raja]]).
   Riveille, joilla on lähtö ja vähintään yksi kosketin, täydennetään johdin viimeisestä koskettimesta lähtöön. */
function RG(k,rows,els,links=[]){const R=newRung(rows);R.k=k;
  for(const [r,c,t,a,x] of els)R.cells[r][c]=Object.assign({t},a?{a}:{},x||{});
  for(const [r,b] of links)R.v[r][b]=true;
  for(let r=0;r<rows;r++){if(!R.cells[r][LD_COLS])continue;let last=-1;for(let c=0;c<LD_COLS;c++)if(R.cells[r][c])last=c;if(last<0)continue;for(let c=last+1;c<LD_COLS;c++)R.cells[r][c]={t:'h'};}
  return R;}

let drag=null;const tip=$('#tip');
function nearestPort(w,maxD=16){let best=null,bd=maxD;for(const c of comps)for(const p of portsW(c)){const d=Math.hypot(p.x-w.x,p.y-w.y);if(d<bd){bd=d;best=p;}}return best;}
function localPt(c,w){const dx=w.x-c.x,dy=w.y-c.y;return rotP(dx,dy,-c.rot);}
cv.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.pointerType==='mouse')return;
  const w=toWorld(e),t=e.target;
  const portEl=t.closest&&t.closest('[data-port]'),compEl=t.closest&&t.closest('.comp'),wireEl=t.closest&&t.closest('.wire');
  cv.setPointerCapture(e.pointerId);
  if(tool==='T'){if(compEl)addTrace(compEl.dataset.id);drag={k:'none'};return;}
  if(portEl){const p=portByKey(portEl.dataset.port);drag={k:'wire',from:p};tmpW.setAttribute('d',`M${p.x},${p.y}L${w.x},${w.y}`);return;}
  if(compEl&&e.shiftKey){const c=byId[compEl.dataset.id];const ids=selIds();setSelIds(ids.includes(c.id)?ids.filter(x=>x!==c.id):[...ids,c.id]);renderSel();buildInsp();drag={k:'none'};return;}
  if(compEl&&sel&&sel.ids&&sel.ids.includes(compEl.dataset.id)){const ids=selIds(),set=new Set(ids);
    drag={k:'gmove',c:byId[compEl.dataset.id],sx:e.clientX,sy:e.clientY,moved:false,w0:w,orig:ids.map(id=>({c:byId[id],x:byId[id].x,y:byId[id].y})),
      ws:wires.filter(x=>x.pts&&set.has(x.a.split(':')[0])&&set.has(x.b.split(':')[0])).map(x=>({w:x,pts:x.pts.map(p=>({...p}))}))};return;}
  if(compEl){const c=byId[compEl.dataset.id];sel={id:c.id};renderSel();buildInsp();const t2=TY[c.type];const [lx,ly]=localPt(c,w);
    const h=t2.hitAt?t2.hitAt(c,lx,ly):t2.hit?t2.hit(c):null;
    if(h&&t2.press&&c.p.toim==='palautuva'){c.st.on=true;drag={k:'press',c};buildInsp();return;}
    drag={k:'move',c,sx:e.clientX,sy:e.clientY,ox:c.x,oy:c.y,hit:h,moved:false};return;}
  if(wireEl){const wi=wires.find(x=>x.id===wireEl.dataset.w);sel={w:wi.id};renderSel();buildInsp();drag={k:'seg',w:wi,sx:e.clientX,sy:e.clientY,moved:false,...segPick(wi,w)};return;}
  if(e.shiftKey){drag={k:'box',w0:w,w1:w,base:selIds()};return;}
  sel=null;renderSel();buildInsp();drag={k:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty};
});
cv.addEventListener('pointermove',e=>{
  if(!drag){hoverTip(e);return;}
  tip.style.display='none';
  if(drag.k==='pan'){view.tx=drag.tx+e.clientX-drag.sx;view.ty=drag.ty+e.clientY-drag.sy;applyView();}
  else if(drag.k==='move'){const dx=(e.clientX-drag.sx)/view.k,dy=(e.clientY-drag.sy)/view.k;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4){drag.moved=true;snapshot();}
    if(drag.moved){drag.c.x=Math.round((drag.ox+dx)/10)*10;drag.c.y=Math.round((drag.oy+dy)/10)*10;placeComp(drag.c);renderPorts();renderWires();renderSel();}}
  else if(drag.k==='wire'){const w=toWorld(e);const p=nearestPort(w,14);const tx=p?p.x:w.x,ty=p?p.y:w.y;tmpW.setAttribute('d',`M${drag.from.x},${drag.from.y}L${tx},${ty}`);}
  else if(drag.k==='gmove'){
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4){drag.moved=true;snapshot();}
    if(drag.moved){const dx=Math.round((e.clientX-drag.sx)/view.k/10)*10,dy=Math.round((e.clientY-drag.sy)/view.k/10)*10;
      for(const o of drag.orig){o.c.x=o.x+dx;o.c.y=o.y+dy;placeComp(o.c);}for(const o of drag.ws)o.w.pts=o.pts.map(p=>({x:p.x+dx,y:p.y+dy}));
      renderPorts();renderWires();renderSel();}}
  else if(drag.k==='box'){drag.w1=toWorld(e);renderSel();const r=mk('rect','boxsel',lS),x=Math.min(drag.w0.x,drag.w1.x),y=Math.min(drag.w0.y,drag.w1.y);
    r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',Math.abs(drag.w1.x-drag.w0.x));r.setAttribute('height',Math.abs(drag.w1.y-drag.w0.y));}
  else if(drag.k==='seg'){
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4){drag.moved=true;snapshot();}
    if(drag.moved&&drag.pts){const P=drag.pts.map(p=>({...p})),i=drag.i;

      else{const x=Math.round((drag.o+(e.clientX-drag.sx)/view.k)/10)*10;P[i].x=x;P[i+1].x=x;}
      drag.w.pts=P.slice(1,-1);renderWires();renderSel();}}
});
function endDrag(e){
  if(!drag)return;
  if(drag.k==='wire'){const w=toWorld(e);const p=nearestPort(w,14);if(p&&p.k!==drag.from.k)addWire(drag.from.k,p.k);tmpW.setAttribute('d','');}
  if(drag.k==='move'){if(drag.moved)save();else if(drag.hit){const t=TY[drag.c.type];if(t.click){t.click(drag.c,drag.hit);buildInsp();}}}

function segPick(wi,pt){

$('#helpBtn').addEventListener('click',()=>openModal(tr(`<h2>Ohje</h2>
<p>Täydellinen käyttöohje esimerkkeineen ja harjoitustehtävineen: <a href="https://jipirtti.github.io/Automaatiosimulaattori/docs/kayttoohje.html" target="_blank" rel="noopener">Automaatiosimulaattorin käyttöohje</a>.</p>
<h3>Piirin rakentaminen</h3><p>Vedä komponentti vasemmalta piirtoalustalle tai klikkaa sitä. Kytke johdin vetämällä liitännästä toiseen. Samaan liitäntään voi kytkeä useita johtimia. Kytkentäpisteellä saat haaran kiskon keskelle. Johtimen reittiä muutetaan vetämällä johtimen osaa. Useita komponentteja valitaan Shift-näppäin pohjassa vetämällä tai Shift+klikkauksella.</p>
<h3>Releet ja koskettimet</h3><p>Kela (rele, kontaktori, aikarele) ja sen koskettimet ovat erillisiä komponentteja kuten piirikaaviossa. Kosketin liitetään laitteeseen ominaisuuspaneelin kohdassa Kuuluu laitteeseen, ja sen numerot määräytyvät tyypin ja kosketinnumeron mukaan (rele 13–14 / 21–22, aikarele 17–18 / 15–16, lämpörele 95–96 / 97–98). Kontaktorin pääkoskettimet 1–6 ovat oma komponenttinsa.</p>
<h3>Ohjaus</h3><p>Painiketta painetaan pitämällä hiiren nappia pohjassa painikkeen käyttölaitteen (vasen reuna) päällä. Hätäseis, valintakytkin, moottorinsuojakytkin, lämpöreleen palautus ja lähteiden kuittaus toimivat klikkaamalla. Anturit ohjautuvat sylinterin asennosta tai käsin, jos toimilaitetta ei ole valittu.</p>
<h3>Aikakaavio</h3><p>Valitse työkaluriviltä Aikakaavioon ja klikkaa komponenttia. Kaavio näyttää kelojen, koskettimien, painikkeiden, anturien ja lamppujen tilat sekä sylinterien asennot ja moottorien pyörimisnopeudet. Klikkaa kaaviota: kaksi kursoria näyttää aikaeron.</p>
<h3>Viat</h3><p>Koskettimille, kelille, antureille ja hätäseisille voi asettaa vian ominaisuuspaneelissa (esimerkiksi hitsautunut kosketin tai katkennut kela). Johtimen voi katkaista valitsemalla johtimen.</p>
<h3>Malli ja rajoitukset</h3><p>Piiri ratkaistaan johtavuustarkasteluna 1 ms aika-askeleella: kuorma toimii, kun sen navat ovat saman lähteen eri napojen kanssa yhteydessä ja jännite on vähintään 70 % nimellisjännitteestä. Releen veto- ja päästöaika on 10 ms, kontaktorin 25 ms. Lämpöreleen ja moottorinsuojakytkimen laukaisu lasketaan lämpömallilla (aikavakio 100 s, laukeaminen 1,2·Ir pysyvällä virralla). Kosketinpomppua, valokaarta, kelojen induktiivisia ilmiöitä ja paineilman virtausta ei mallinneta.</p>
<p class="mcopy">Tekijä: Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK), 2026. Suunnittelu, sisältö ja validointi: Juho Pirttilahti. Ohjelmakoodi toteutettu tekoälyavusteisesti (Claude, Anthropic). Ohjelma on lisensoitu <a href="https://creativecommons.org/licenses/by/4.0/deed.fi" target="_blank" rel="license noopener">Creative Commons Nimeä 4.0 Kansainvälinen -lisenssillä (CC BY 4.0)</a>. Saat kopioida, jakaa ja muokata sitä mihin tahansa tarkoitukseen, kunhan mainitset tekijän ja oppilaitoksen, merkitset lisenssin ja kerrot tekemistäsi muutoksista.</p>`,
`<h2>Help</h2>
<p>Full user manual with examples and exercises: <a href="https://jipirtti.github.io/Automaatiosimulaattori/docs/user-manual.html" target="_blank" rel="noopener">Automation Simulator user manual</a>.</p>
<h3>Building a circuit</h3><p>Drag a component from the left onto the canvas, or click it. Connect a wire by dragging from one terminal to another. Several wires can be connected to the same terminal. Use a junction to branch from the middle of a rail. Reshape a wire by dragging a section of it. Select several components by dragging with Shift held down or with Shift+click.</p>
<h3>Relays and contacts</h3><p>A coil (relay, contactor, timer relay) and its contacts are separate components, as in a circuit diagram. A contact is linked to its device in the properties panel under Belongs to, and its terminal numbers follow the type and contact number (relay 13–14 / 21–22, timer relay 17–18 / 15–16, overload relay 95–96 / 97–98). The contactor main contacts 1–6 are a component of their own.</p>
<h3>Operating</h3><p>Press a push button by holding the mouse button down on its actuator (left edge). Emergency stop, selector switch, motor protection switch, overload relay reset and supply reset work by clicking. Sensors follow the cylinder position, or are operated by hand if no actuator is selected.</p>
<h3>Timing diagram</h3><p>Choose To timing diagram on the toolbar and click a component. The diagram shows the states of coils, contacts, buttons, sensors and lamps, the cylinder positions and the motor speeds. Click the diagram: two cursors show a time difference.</p>
<h3>Faults</h3><p>Contacts, coils, sensors and emergency stops can be given a fault in the properties panel (for example a welded contact or an open coil). A wire can be broken by selecting it.</p>
<h3>Model and limitations</h3><p>The circuit is solved as a connectivity problem with a 1 ms time step: a load operates when its terminals are connected to different terminals of the same source and the voltage is at least 70 % of the rated voltage. Relay operate and release time is 10 ms, contactor 25 ms. Overload and motor protection tripping uses a thermal model (time constant 100 s, trips at a steady 1.2·Ir). Contact bounce, arcing, inductive coil effects and compressed-air flow are not modelled.</p>
<p class="mcopy">Author: Juho Pirttilahti, Seinäjoki University of Applied Sciences (SEAMK), 2026. Design, content and validation: Juho Pirttilahti. Code implemented with AI assistance (Claude, Anthropic). Licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license noopener">Creative Commons Attribution 4.0 International (CC BY 4.0)</a>. You may copy, share and adapt it for any purpose, provided you credit the author and the institution, indicate the licence and state your changes.</p>`,`<h2>Hilfe</h2>
<p>Vollständige Bedienungsanleitung mit Beispielen und Übungen: <a href="https://jipirtti.github.io/Automaatiosimulaattori/docs/bedienungsanleitung.html" target="_blank" rel="noopener">Bedienungsanleitung des Automatisierungs-Simulators</a>.</p>
<h3>Schaltung aufbauen</h3><p>Ziehen Sie ein Bauteil von links auf die Zeichenfläche oder klicken Sie es an. Eine Leitung verbinden Sie, indem Sie von einem Anschluss zu einem anderen ziehen. An einen Anschluss können mehrere Leitungen angeschlossen werden. Für einen Abzweig aus der Mitte einer Schiene verwenden Sie einen Verbindungspunkt. Den Verlauf einer Leitung ändern Sie, indem Sie einen Abschnitt ziehen. Mehrere Bauteile wählen Sie mit gedrückter Umschalttaste durch Ziehen oder mit Umschalt+Klick aus.</p>
<h3>Relais und Kontakte</h3><p>Eine Spule (Relais, Schütz, Zeitrelais) und ihre Kontakte sind getrennte Bauteile, wie im Stromlaufplan. Ein Kontakt wird im Eigenschaftenfeld unter Gehört zu seinem Gerät zugeordnet; seine Anschlussbezeichnungen richten sich nach Typ und Ordnungsziffer (Relais 13–14 / 21–22, Zeitrelais 17–18 / 15–16, Motorschutzrelais 95–96 / 97–98). Die Hauptkontakte 1–6 des Schützes sind ein eigenes Bauteil.</p>
<h3>Bedienen</h3><p>Einen Taster betätigen Sie, indem Sie die Maustaste auf seinem Betätiger (linker Rand) gedrückt halten. Not-Halt, Wahlschalter, Motorschutzschalter, die Rückstellung des Motorschutzrelais und die Rückstellung der Versorgung werden per Klick bedient. Sensoren folgen der Zylinderstellung oder werden von Hand betätigt, wenn kein Betätiger gewählt ist.</p>
<h3>Zeitdiagramm</h3><p>Wählen Sie in der Werkzeugleiste Ins Zeitdiagramm und klicken Sie ein Bauteil an. Das Diagramm zeigt die Zustände von Spulen, Kontakten, Tastern, Sensoren und Leuchten, die Zylinderstellungen und die Motordrehzahlen. Klicken Sie ins Diagramm: Zwei Cursor zeigen eine Zeitdifferenz.</p>
<h3>Fehler</h3><p>Kontakten, Spulen, Sensoren und Not-Halt-Geräten kann im Eigenschaftenfeld ein Fehler zugewiesen werden (zum Beispiel ein verschweißter Kontakt oder eine unterbrochene Spule). Eine Leitung kann unterbrochen werden, indem man sie auswählt.</p>
<h3>Modell und Grenzen</h3><p>Die Schaltung wird als Verbindungsproblem mit einem Zeitschritt von 1 ms gelöst: Ein Verbraucher spricht an, wenn seine Anschlüsse mit verschiedenen Polen derselben Quelle verbunden sind und die Spannung mindestens 70 % der Bemessungsspannung beträgt. Die Ansprech- und Rückfallzeit beträgt beim Relais 10 ms, beim Schütz 25 ms. Die Auslösung von Motorschutzrelais und Motorschutzschalter nutzt ein thermisches Modell (Zeitkonstante 100 s, Auslösung bei dauerhaft 1,2·Ir). Kontaktprellen, Lichtbögen, induktive Effekte der Spulen und der Druckluftdurchfluss werden nicht modelliert.</p>

function issueLink(v,i){

function copyText(s){

    ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();

  try{if(!navigator.clipboard||!window.ClipboardItem)throw new Error('ClipboardItem');
    await navigator.clipboard.write([new ClipboardItem({'image/png':cvP.then(toBlob)})]);ok=true;toast(t('ok'));}
  catch(e){try{fallback(await cvP,k,e);}catch(e2){toast(t('err')+(e2.message||e2));}}
  finally{if(btn){btn.disabled=false;btn.textContent=t('btn');}}
  return ok;}
function place(o){const p=o.paikka||{sel:'auto'};const host=p.sel==='auto'?autoHead(o):one(p.sel);if(!host)return null;let b=host.querySelector(':scope > .skv-btn[data-skv="'+o.id+'"]')||document.querySelector('.skv-btn[data-skv="'+o.id+'"]');
  if(b)return b;b=document.createElement('button');b.type='button';b.className='skv-btn';b.dataset.skv=o.id;
  if(p.tapa==='kulma'){if(getComputedStyle(host).position==='static')host.style.position='relative';b.classList.add('skv-kulma');host.appendChild(b);}
  else if(p.tapa==='lisaa'){b.classList.add('skv-lisaa');host.appendChild(b);}
  else{const par=host.parentElement;if(par.classList.contains('chead')||par.classList.contains('skv-head'))par.appendChild(b);
    else{const w=document.createElement('div');w.className='skv-head';par.insertBefore(w,host);w.appendChild(host);w.appendChild(b);}}
  b.addEventListener('click',()=>copy(o.id,b));return b;}
function relabel(){document.querySelectorAll('.skv-btn[data-skv]').forEach(b=>{if(!b.disabled&&b.textContent!==t('btn'))b.textContent=t('btn');if(b.title!==t('title')){b.title=t('title');b.setAttribute('aria-label',t('title'));}});}
function placeAll(){for(const o of C.kaaviot)place(o);relabel();}
window.SimKuva={
  init(cfg){C=cfg;css();placeAll();
    new MutationObserver(()=>relabel()).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
    document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-lang]'))setTimeout(relabel,0);});
    let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;for(const o of C.kaaviot){if(!document.querySelector('.skv-btn[data-skv="'+o.id+'"]'))place(o);}relabel();});})
      .observe(document.body,{childList:true,subtree:true});},
  render,copy,ids:()=>C?C.kaaviot.map(o=>o.id):[],lastError:()=>lastErr};
})();

SimKuva.init({nimi:{fi:'Automaatiosimulaattori',en:'Automation Simulator',de:'Automatisierungs-Simulator'},repo:'Jipirtti/Automaatiosimulaattori',api:()=>window.AutSim,redraw:()=>window.AutSim.redraw(),
  kaaviot:[
    {id:'piiri',kohde:'#cv',otsikko:()=>(window.AutSim&&window.AutSim.lang&&window.AutSim.lang()==='en')?'Circuit diagram':'Piirikaavio',selite:'#legend',paikka:{sel:'#stage',tapa:'kulma'},
     svg:{rajaa:['#lWires','#lComps','#lPorts','#lLabels'],piilota:['#lSel','#tmpWire','#gridRect'],maailma:'#world'}},
    {id:'alapaneeli',paikka:{sel:'.scope .tabs',tapa:'lisaa'},selite:null,
     otsikko:()=>{const b=document.querySelector('.scope .tabs [data-tab][aria-pressed="true"]');return b?b.textContent.trim():'';},
     kohde:()=>{const ed=document.getElementById('plcEd');return ed&&!ed.hidden?[...ed.querySelectorAll('.ldr')].map(r=>{const h=r.querySelector('.ldrh b'),k=r.querySelector('.ldrh input');
       return{el:r.querySelector('svg.rung'),nimi:(h?h.textContent.trim():'')+(k&&k.value.trim()?' · '+k.value.trim():'')};}):[document.getElementById('tdv')];}}]});
</script>

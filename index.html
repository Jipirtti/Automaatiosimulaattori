<!doctype html>
<!--
  Automaatiosimulaattori – relelogiikka, ohjauspiirit, anturit ja toimilaitteet
  Tekijä: Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK), 2026.
  Suunnittelu, sisältö ja validointi: Juho Pirttilahti. Ohjelmakoodi toteutettu tekoälyavusteisesti (Claude, Anthropic).
  Lisenssi: Creative Commons Nimeä 4.0 Kansainvälinen (CC BY 4.0), https://creativecommons.org/licenses/by/4.0/deed.fi
  Saat kopioida, jakaa ja muokata ohjelmaa mihin tahansa tarkoitukseen, kunhan mainitset
  tekijän ja oppilaitoksen, merkitset lisenssin ja kerrot tekemistäsi muutoksista.
-->
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Automaatiosimulaattori</title>
<meta name="author" content="Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK)">
<meta name="copyright" content="Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK), 2026. CC BY 4.0">
<link rel="license" href="https://creativecommons.org/licenses/by/4.0/deed.fi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#DCE3E9; --paper:#F7F9FA; --grid:#E2E8ED; --grid2:#D3DBE2; --panel:#EDF1F4; --ink:#17212B; --muted:#56636F;
  --line:#C2CBD3; --acc:#E39B17; --sel:#1E5DBA; --ok:#2E8B57; --warn:#C0392B; --on:#E39B17;
  --scr:#0D1418; --scrgrid:#2A3A40; --scrtxt:#9FB3BA;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --paper:#131A20; --grid:#1A232B; --grid2:#222D36; --panel:#161F26; --ink:#E2E8EE; --muted:#93A0AC;
    --line:#2A3540; --acc:#F0A82A; --sel:#6FA7FF; --ok:#4CC38A; --warn:#FF6B5B; --on:#F0A82A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --paper:#131A20; --grid:#1A232B; --grid2:#222D36; --panel:#161F26; --ink:#E2E8EE; --muted:#93A0AC;
  --line:#2A3540; --acc:#F0A82A; --sel:#6FA7FF; --ok:#4CC38A; --warn:#FF6B5B; --on:#F0A82A;
}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:1px}

.app{height:100%;display:grid;grid-template-columns:222px minmax(0,1fr) 316px;grid-template-rows:auto minmax(0,1fr) 250px;
  grid-template-areas:"bar bar bar" "pal stage insp" "pal scope insp"}
.bar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
.brand strong{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;font-weight:600}
.brand span{font-size:13px;color:var(--muted)}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langsw button{border:0;background:var(--paper);padding:5px 12px;cursor:pointer;font-size:14px;font-weight:600}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mnote{font-size:13px;color:var(--muted);margin:6px 0 2px}
.btn{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--muted)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:118px}
.btn.on{background:var(--acc);border-color:var(--acc);color:#1E1404}
.btn.danger{color:var(--warn)}
select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:34px}
.mini{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.time{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;font-variant-numeric:tabular-nums;min-width:130px}

.pal{grid-area:pal;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 8px 20px}
.pal h3{font-size:13px;font-weight:600;color:var(--muted);margin:12px 4px 6px}
.pal h3:first-child{margin-top:2px}
.copy a,.mcopy a{color:inherit}
.copy{font-size:11.5px;line-height:1.35;color:var(--muted);margin:14px 4px 0;padding-top:10px;border-top:1px solid var(--line)}
.mcopy{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.pitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px 4px 4px;margin:0 0 5px;cursor:grab;touch-action:none;user-select:none;font-size:14px;line-height:1.15}
.pitem:hover{border-color:var(--acc)}
.pitem svg{width:46px;height:34px;flex:none;color:var(--ink)}
.ghost{position:fixed;pointer-events:none;z-index:50;background:var(--paper);border:1px solid var(--acc);border-radius:8px;padding:4px 10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}

.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;color:var(--ink);user-select:none;-webkit-user-select:none}
.tools{position:absolute;left:10px;top:10px;z-index:5;display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;max-width:calc(100% - 20px)}
.tools button{border:0;background:transparent;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tools .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.tools label{display:flex;align-items:center;gap:5px;font-size:14px;padding:0 8px;color:var(--muted)}
.status{position:absolute;left:10px;right:10px;bottom:8px;z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;pointer-events:none}
.legendp{pointer-events:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.legendp .grad{width:120px;height:9px;border-radius:5px;background:linear-gradient(90deg,#2E6FD0,#7A8794 50%,#D23B2E)}
.legendp select{min-height:26px;padding:1px 4px;font-size:13px}
.warns{pointer-events:auto;font-size:13px;display:flex;flex-direction:column;gap:3px;max-width:560px}
.warns div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:3px 8px}
.warns div.info{border-left-color:var(--sel)}
.tip{position:absolute;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums}

.insp{grid-area:insp;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:12px 14px 30px}
.insp h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:600;margin:0 0 2px}
.insp h3{font-size:14px;font-weight:600;margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.insp p{margin:0 0 8px;color:var(--muted)}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ih input{width:86px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:600;background:transparent;border:1px solid transparent;border-radius:6px;padding:0 4px}
.ih input:hover,.ih input:focus{border-color:var(--line);background:var(--paper)}
.tn{color:var(--muted);font-size:14px}
.fld{display:grid;grid-template-columns:1fr 128px;gap:8px;align-items:center;margin:0 0 6px;font-size:14px}
.fld .inp{display:flex;align-items:center;gap:4px}
.fld input,.fld select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:30px;font-variant-numeric:tabular-nums}
.fld em{font-style:normal;color:var(--muted);font-size:12.5px;min-width:34px}
.der{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0;font-size:14px}
.der dt{color:var(--muted)}
.der dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.der .bad{color:var(--warn);font-weight:600}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.help .res{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:6px 0;font-size:14px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.kbd{font-size:12.5px;color:var(--muted)}

/* aikakaavio */
.scope{grid-area:scope;border-top:1px solid var(--line);background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;padding:8px 12px;min-height:0}
.scr{position:relative;min-height:0;display:flex;flex-direction:column;gap:4px}
.scr canvas{flex:1;min-height:0;width:100%;display:block;background:var(--paper);border-radius:8px;border:1px solid var(--line);cursor:crosshair}
.curs{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:18px}
.sctl{overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:6px;min-height:0}
.sctl .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sctl select{min-height:28px;padding:2px 5px;font-size:13px;border-radius:6px}
.sctl .lbl{color:var(--muted)}
.ch{display:grid;grid-template-columns:14px minmax(0,1fr) 26px;gap:6px;align-items:center}
.ch i{width:12px;height:12px;border-radius:3px;display:inline-block}
.ch .tg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch button{border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;height:24px}
.empty{color:var(--muted);font-size:13px;margin:2px 0}
.legw{display:flex;align-items:center;gap:4px}
.legw i{width:18px;height:4px;border-radius:2px;display:inline-block}

.modal{position:fixed;inset:0;background:rgba(10,15,20,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
.mbox h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;margin:0 0 8px}
.mbox h3{font-size:15px;margin:14px 0 4px}
.mbox p{margin:0 0 8px;max-width:70ch}
.mbox textarea{width:100%;height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:flex-end}

/* SVG */
.sy{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.syf{fill:var(--paper);stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.fi{fill:currentColor}
.dash{stroke-dasharray:4 3}
.cond{fill:var(--on);stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.hot{stroke:var(--on);stroke-width:3}
.sym{fill:currentColor;font:600 14px "Barlow",system-ui,sans-serif}
.syms{fill:currentColor;font:600 11px "Barlow",system-ui,sans-serif}
.hit{fill:transparent;stroke:none}
.comp{cursor:move}
.wh{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.wb{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.wire.brk .wb{stroke-dasharray:6 5}
.hotl{stroke:var(--on);stroke-width:2.6}
.led{stroke:currentColor;stroke-width:1}
.mot{fill:none;stroke:var(--on);stroke-width:2.4}
.wire.selw .wb{stroke-width:5}
.wire.selw .wh{cursor:move}
.boxsel{fill:rgba(30,93,186,.08);stroke:#1E5DBA;stroke-width:1.2;stroke-dasharray:5 4}
.selr{fill:none;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:5 4}
.port{fill:var(--paper);stroke:currentColor;stroke-width:1.5;cursor:crosshair}
.port.con{fill:currentColor}
.port:hover{stroke:var(--sel);stroke-width:3}
.pt{fill:var(--muted);font:500 10px "Barlow",system-ui,sans-serif;pointer-events:none}
.lt{fill:currentColor;font:600 12.5px "Barlow",system-ui,sans-serif;pointer-events:none}
.rt{fill:var(--muted);font:500 12px "Barlow",system-ui,sans-serif;pointer-events:none;font-variant-numeric:tabular-nums}
.probe{cursor:grab}
.probe rect{fill:var(--paper);stroke-width:1.8}
.probe text{font:600 12.5px "Barlow",system-ui,sans-serif;fill:currentColor;font-variant-numeric:tabular-nums}
.probe line{stroke-width:1.3;stroke-dasharray:3 2}
#tmpWire{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}

@media (max-width:900px){
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto auto 62vh auto auto;
    grid-template-areas:"bar" "pal" "stage" "scope" "insp"}
  .pal{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .pal h3,.pal .copy{display:none}
  .pitem{width:auto;flex:none;margin:0;touch-action:pan-x}
  .insp{border-left:0;border-top:1px solid var(--line)}
  .scope{grid-template-columns:1fr}
  .scr canvas{height:240px;flex:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><strong data-en="Automation Simulator">Automaatiosimulaattori</strong><span>Juho Pirttilahti, SEAMK 2026, CC BY 4.0</span></div>
    <div class="langsw" role="group" aria-label="Kieli / Language"><button type="button" data-lang="fi" lang="fi">FI</button><button type="button" data-lang="en" lang="en">EN</button></div>
    <div class="grp">
      <button class="btn pri" id="runBtn" type="button">Pysäytä</button>
      <button class="btn" id="resetBtn" type="button" title="Releet, ajastimet, sylinterit ja suojalaitteet alkutilaan, aika nollaan" data-en-title="Relays, timers, cylinders and protective devices to their initial state, time to zero" data-en="Reset state">Nollaa tila</button>
      <label class="mini"><span data-en="Sim. speed">Nopeus</span>
        <select id="speed">
          <option value="0.1" data-en="0.1 s/s (slow motion)">0,1 s/s (hidastus)</option>
          <option value="0.25">0,25 s/s</option>
          <option value="1" data-en="1 s/s (real time)">1 s/s (reaaliaika)</option>
          <option value="5">5 s/s</option>
          <option value="10">10 s/s</option>
        </select>
      </label>
      <span class="time" id="simTime">t = 0,000 s</span>
    </div>
    <div class="grp">
      <select id="exSel" aria-label="Esimerkkipiirit" data-en-aria="Example circuits">
        <option value="" data-en="Example circuits…">Esimerkkipiirit…</option>
        <option value="ex1" data-en="1. Self-holding circuit (start/stop)">1. Itsepitopiiri (käynnistys ja pysäytys)</option>
        <option value="ex2" data-en="2. Direct-on-line start with thermal overload relay">2. Moottorin suora käynnistys ja lämpörele</option>
        <option value="ex3" data-en="3. Reversing with interlocking">3. Suunnanvaihto ja ristiinlukitus</option>
        <option value="ex4" data-en="4. Star–delta start">4. Tähti–kolmiokäynnistys</option>
        <option value="ex5" data-en="5. On-delay and off-delay timers">5. Vetoviive- ja päästöviiverele</option>
        <option value="ex6" data-en="6. Electro-pneumatics: automatic return">6. Sähköpneumatiikka: automaattinen paluu</option>
        <option value="ex7" data-en="7. Sequence A+ B+ A− B−">7. Sekvenssi A+ B+ A− B−</option>
        <option value="ex8" data-en="8. Emergency stop with a safety relay">8. Hätäseis ja turvarele</option>
      </select>
      <button class="btn" id="undoBtn" type="button" title="Ctrl+Z" data-en="Undo">Kumoa</button>
      <button class="btn" id="ioBtn" type="button" data-en="Save / load">Tallenna / lataa</button>
      <button class="btn" id="fitBtn" type="button" data-en="Fit view">Sovita näkymä</button>
      <button class="btn danger" id="clearBtn" type="button" data-en="Clear">Tyhjennä</button>
      <button class="btn" id="helpBtn" type="button" data-en="Help">Ohje</button>
      <a class="btn" id="manualLink" href="https://jipirtti.github.io/Automaatiosimulaattori/docs/kayttoohje.html" target="_blank" rel="noopener" data-en="Manual (FI)">Käyttöohje</a>
    </div>
  </header>

  <aside class="pal" id="pal" aria-label="Komponentit" data-en-aria="Components"></aside>

  <main class="stage" id="stage">
    <div class="tools" role="toolbar" aria-label="Työkalut" data-en-aria="Tools">
      <button type="button" data-tool="sel" aria-pressed="true" title="V"><span data-en="Select and connect">Valitse ja kytke</span></button>
      <button type="button" data-tool="T" aria-pressed="false" title="Klikkaa komponenttia: sen tila aikakaavioon" data-en-title="Click a component: its state to the timing diagram"><i class="sw" style="background:#0E8FB8"></i><span data-en="To timing diagram">Aikakaavioon</span></button>
      <label><input type="checkbox" id="showRead" checked> <span data-en="Readings">Lukemat</span></label>
    </div>
    <svg id="cv" aria-label="Piirtoalusta" data-en-aria="Drawing canvas">
      <defs>
        <pattern id="gridPat" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0H0V20" fill="none" stroke="var(--grid)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect id="gridRect" width="100%" height="100%" fill="url(#gridPat)"/>
      <g id="world">
        <g id="lWires"></g><g id="lComps"></g><g id="lSel"></g><g id="lPorts"></g><g id="lLabels"></g>
        <path id="tmpWire" d=""/>
      </g>
    </svg>
    <div class="status">
      <div class="legendp" id="legend"></div>
      <div class="warns" id="warns"></div>
    </div>
    <div class="tip" id="tip"></div>
  </main>

  <aside class="insp" id="insp" aria-label="Ominaisuudet ja mitoitus" data-en-aria="Properties and sizing"></aside>

  <section class="scope" aria-label="Aikakaavio" data-en-aria="Timing diagram">
    <div class="scr"><canvas id="tdv" aria-label="Aikakaavio" data-en-aria="Timing diagram"></canvas><div class="curs" id="curs"></div></div>
    <div class="sctl" id="sctl"></div>
  </section>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
/* ---------- kieli / language ---------- */
let lang=(()=>{try{const u=new URLSearchParams(location.search).get('lang');if(u==='fi'||u==='en')return u;const st=localStorage.getItem('autsim-lang');if(st==='fi'||st==='en')return st;}catch(e){}
  return (navigator.language||'fi').toLowerCase().startsWith('fi')?'fi':'en';})();
const tr=(fi,en)=>lang==='en'?en:fi;
const L2=a=>Array.isArray(a)?(lang==='en'?a[1]:a[0]):a;      // [fi, en] → current language

/* ---------- vakiot ja apufunktiot ---------- */
const DT=1e-3;                       // aika-askel 1 ms
const TAU_TH=100;                    // lämpöreleen ja moottorinsuojakytkimen lämpenemisaikavakio (s)
const H_TRIP=1.44;                   // laukeamisraja: (1,2·Ir)² pysyvässä tilassa
const H_RESET=1.2;                   // palautus sallittu, kun lämpötila on laskenut tämän alle
const SQ3=Math.sqrt(3);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const nf=(x,d=1)=>Number.isFinite(x)?(Math.abs(x)<0.5*Math.pow(10,-d)?0:x).toLocaleString(lang==='en'?'en-US':'fi-FI',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:false}):'–';
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const fs=x=>`${nf(x,x<10?2:1)} s`;

/* ---------- symbolien apufunktiot ---------- */
const r1=v=>Math.round(v*10)/10;
const L=(x1,y1,x2,y2,c='sy')=>`<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" class="${c}"/>`;

const RECT=(x,y,w,h,c='syf')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${c}"/>`;
const CIRC=(x,y,r,c='syf')=>`<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`;
/* pystysuuntainen kosketin sarakkeessa cx, liitännät y = ±30 */
const C_NO_ST=cx=>L(cx,-30,cx,-12)+L(cx,12,cx,30);
const C_NO_DY=(cx,on)=>on?L(cx,12,cx,-12,'sy hotl'):L(cx,12,cx-11,-10);
const C_NC_ST=cx=>L(cx,-30,cx,-12)+L(cx,-12,cx+9,-12)+L(cx,12,cx,30);
const C_NC_DY=(cx,on)=>on?L(cx,12,cx+9,-12,'sy hotl'):L(cx,12,cx-9,-10);
const C_ST=(no,cx=0)=>no?C_NO_ST(cx):C_NC_ST(cx);
const C_DY=(no,on,cx=0)=>no?C_NO_DY(cx,on):C_NC_DY(cx,on);
const LINK=(x1,x2,y=0)=>L(x1,y,x2,y,'sy dash');
/* käyttölaitteet kosketinsymbolin vasemmalla puolella */
const ACT_PUSH=(x=-24,p=false)=>{const d=p?4:0;return L(x+d,-6,x+d,6)+L(x+d,-6,x+d-4,-6)+L(x+d,6,x+d-4,6);};
const ACT_TURN=(x=-24)=>L(x-4,-6,x,-6)+L(x,-6,x,6)+L(x,6,x+4,6);
const ACT_ROLL=(x=-24)=>CIRC(x-4,0,4)+L(x,0,x+2,0);
const ACT_MAG=(x=-24)=>`<polygon class="syf" points="${x-10},0 ${x-5},-5 ${x},0 ${x-5},5"/>`;
const COIL=(on,extra='')=>L(0,-30,0,-9)+L(0,9,0,30)+`<rect x="-13" y="-9" width="26" height="18" class="${on?'cond':'syf'}"/>`+extra;

/* kosketinnumerot: rele NO n3–n4, NC n1–n2; aikarele NO n7–n8, NC n5–n6; lämpörele NC 95–96, NO 97–98 */
function cNum(c,first){const p=c.p,no=p.kosk==='NO',r=refComp(c),n=p.nro||1;
  if(r&&r.type==='ol')return no?(first?'97':'98'):(first?'95':'96');
  if(r&&r.type==='kt')return no?`${n}${first?7:8}`:`${n}${first?5:6}`;
  return no?`${n}${first?3:4}`:`${n}${first?1:2}`;}
function refComp(c){const r=c.p.ref;if(!r)return null;return comps.find(x=>x.label===r&&TY[x.type].actor)||comps.find(x=>x.label===r&&x.type==='cyl')||null;}

const LAMPC={vihrea:'#3CC46A',punainen:'#E5483B',keltainen:'#F2C230',valkoinen:'#F4F6F8',sininen:'#3D86E8'};

/* kosketinvian huomiointi */
function cState(c,nominal){const v=c.p.vika;if(v==='kiinni')return true;if(v==='auki')return false;return nominal;}
/* toimilaitteen (rele, aikarele, lämpörele, moottorinsuojakytkin) asento koskettimille */
function actorOn(r){if(!r)return false;if(r.type==='k'||r.type==='kt')return r.st.on;if(r.type==='ol')return r.st.trip;if(r.type==='qm')return r.st.on;return false;}
/* pakko-ohjatut koskettimet / peilikoskettimet: jos jokin releen sulkeutuva kosketin tai pääkosketin on hitsautunut,
   avautuvat koskettimet eivät sulkeudu (EN 50205, IEC 60947-4-1 liite F) */
function weldedNO(r){return comps.some(x=>x.p&&x.p.ref===r.label&&((x.type==='kc'&&x.p.kosk==='NO'&&x.p.vika==='kiinni')||(x.type==='km'&&x.p.vika!=='ei')));}
function contactClosed(c){const r=refComp(c);let on=actorOn(r);const no=c.p.kosk==='NO';
  if(!no&&r&&(r.type==='k')&&weldedNO(r))on=true;
  return cState(c,no?on:!on);}
function sensed(c){const r=c.p.ref?comps.find(x=>x.label===c.p.ref&&x.type==='cyl'):null;
  if(!r)return !!c.st.on;return c.p.asema==='etu'?r.st.x>=0.999:r.st.x<=0.001;}
function proxOut(c){if(c.p.vika==='kiinni')return !!c.st.pw;if(c.p.vika==='auki'||!c.st.pw)return false;const a=sensed(c);return c.p.kosk==='NO'?a:!a;}
function sensRead(c){if(c.p.ref)return `${c.p.ref} ${c.p.asema==='etu'?tr('etu','front'):tr('taka','rear')}`;return sensed(c)?tr('tunnistaa','detecting'):'';}
function xref(c){const cs=comps.filter(x=>x.p&&x.p.ref===c.label&&(x.type==='kc'||x.type==='km'));
  return cs.map(x=>x.type==='km'?'1–6':`${cNum(x,1)}–${cNum(x,0)}`).join(' · ');}
function cylRead(c){const x=c.st.x;if(x>=0.999)return tr('ulkona','extended');if(x<=0.001)return tr('sisällä','retracted');return `${nf(x*100,0)} %`;}
function motRead(c){const s=c.st;if(Math.abs(s.n)<1&&!s.I)return '';return `${nf(Math.abs(s.n),0)} ${tr('r/min','rpm')}${s.conn==='Y'?' Y':s.conn==='D'?' Δ':''} · ${nf(s.I,1)} A`;}
function motDyn(c){const s=c.st,a=s.ang||0;let h=`<circle cx="${r1(17*Math.cos(a))}" cy="${r1(17*Math.sin(a))}" r="2.6" class="fi"/>`;
  if(s.dir)h+=`<path class="mot" d="M${s.dir>0?'-9,-30 A30,30 0 0 1 9,-30':'9,-30 A30,30 0 0 0 -9,-30'}"/>`;return h;}
function srLock(k){return {erivat:tr('kanavat eriävät','channels differ'),ristikko:tr('kanavien välinen oikosulku','cross short between channels')}[k]||k;}
function olReset(c){if(!c.st.trip)return;if(c.st.h>H_RESET){flashWarn(tr(`${c.label}: lämpörele on vielä kuuma, anna jäähtyä ennen palautusta.`,`${c.label}: the overload relay is still hot, let it cool down before reset.`));return;}c.st.trip=false;}

/* ---------- geometria ---------- */
function rotP(x,y,r){switch(((r%360)+360)%360){case 90:return[-y,x];case 180:return[-x,-y];case 270:return[y,-x];default:return[x,y];}}
const plab=(p,c)=>typeof p.lab==='function'?p.lab(c):p.lab;
function portsW(c){return TY[c.type].ports.map(p=>{const[x,y]=rotP(p.x,p.y,c.rot),[dx,dy]=rotP(p.d[0],p.d[1],c.rot);
  return {n:p.n,lab:plab(p,c),x:c.x+x,y:c.y+y,d:[Math.round(dx),Math.round(dy)],k:c.id+':'+p.n,c};});}
function bbW(c){const b=TY[c.type].bb,a=rotP(b[0],b[1],c.rot),d=rotP(b[2],b[3],c.rot);
  return [c.x+Math.min(a[0],d[0]),c.y+Math.min(a[1],d[1]),c.x+Math.max(a[0],d[0]),c.y+Math.max(a[1],d[1])];}
function portByKey(k){const i=k.indexOf(':');const c=byId[k.slice(0,i)];if(!c)return null;const pn=k.slice(i+1);return portsW(c).find(p=>p.n===pn)||null;}
function route(p1,p2){
  const s1={x:p1.x+p1.d[0]*10,y:p1.y+p1.d[1]*10},s2={x:p2.x+p2.d[0]*10,y:p2.y+p2.d[1]*10};
  const mx=(s1.x+s2.x)/2,my=(s1.y+s2.y)/2;
  const cands=[[{x:s2.x,y:s1.y}],[{x:s1.x,y:s2.y}],[{x:mx,y:s1.y},{x:mx,y:s2.y}],[{x:s1.x,y:my},{x:s2.x,y:my}]];
  let best=null,bc=Infinity;
  for(const mid of cands){const pts=[p1,s1,...mid,s2,p2];let cost=0,pd=null;
    for(let i=1;i<pts.length;i++){const dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y,l=Math.abs(dx)+Math.abs(dy);if(l<0.5)continue;
      const d=[Math.sign(dx),Math.sign(dy)];if(pd&&d[0]===-pd[0]&&d[1]===-pd[1])cost+=1000;cost+=l;if(pd&&(d[0]!==pd[0]||d[1]!==pd[1]))cost+=6;pd=d;}
    if(cost<bc){bc=cost;best=pts;}}
  return simplifyPts(best);
}
function simplifyPts(pts){
  const out=[{x:pts[0].x,y:pts[0].y}];
  for(let i=1;i<pts.length;i++){const a=out[out.length-1],p=pts[i];if(Math.abs(p.x-a.x)+Math.abs(p.y-a.y)>0.5)out.push({x:p.x,y:p.y});}
  for(let i=out.length-2;i>=1;i--){const a=out[i-1],b=out[i],c=out[i+1];
    if((Math.abs(a.x-b.x)<0.5&&Math.abs(b.x-c.x)<0.5)||(Math.abs(a.y-b.y)<0.5&&Math.abs(b.y-c.y)<0.5))out.splice(i,1);}
  return out;
}
function orthoPts(pts){
  const out=[pts[0]];
  for(let i=1;i<pts.length;i++){const a=out[out.length-1],p=pts[i];
    if(Math.abs(p.x-a.x)>0.5&&Math.abs(p.y-a.y)>0.5){const prevH=out.length>1&&Math.abs(out[out.length-2].y-a.y)<0.5;out.push(prevH?{x:a.x,y:p.y}:{x:p.x,y:a.y});}
    out.push(p);}
  return out;
}
function wirePts(w,a,b){if(!w.pts||!w.pts.length)return route(a,b);return simplifyPts(orthoPts([{x:a.x,y:a.y},...w.pts.map(p=>({x:p.x,y:p.y})),{x:b.x,y:b.y}]));}
const ptsD=pts=>'M'+pts.map(p=>`${r1(p.x)},${r1(p.y)}`).join('L');

/* ---------- piirin ratkaisu ----------
   Relelogiikka ratkaistaan johtavuustarkasteluna: johtimet ja suljetut koskettimet yhdistävät liitännät ryhmiksi
   (union–find). Kuorman (kela, lamppu, anturi) jännite on saman lähteen napojen potentiaalien erotus, jos kuorman
   liitännät ovat eri napojen ryhmissä. Kuorma toimii, kun jännite on vähintään 0,7·Un. Sarjaan kytketyt kuormat eivät
   toimi (kummallekin jää alle 0,7·Un). Aika-askel on 1 ms; releet, ajastimet, sylinterit ja moottorit päivittyvät
   askeleittain, joten kosketintilojen muutos näkyy piirissä seuraavalla askeleella. */
function rebuild(){
  const pk=[],pi={};
  for(const c of comps){c.pidx={};for(const p of TY[c.type].ports){const k=c.id+':'+p.n;pi[k]=pk.length;c.pidx[p.n]=pk.length;pk.push(k);}}
  const wE=[];for(const w of wires)if(!w.broken&&pi[w.a]!==undefined&&pi[w.b]!==undefined)wE.push(pi[w.a],pi[w.b]);
  S={np:pk.length,pk,pi,wE:Int32Array.from(wE),root:new Int32Array(pk.length),gT:new Map(),key:'',attr:new Map(),
     swc:comps.filter(c=>TY[c.type].sw),srcs:comps.filter(c=>TY[c.type].src),motors:comps.filter(c=>TY[c.type].motor),
     prot:comps.filter(c=>c.type==='ol'||c.type==='qm'),warn:{},short:[]};
  for(const c of comps)if(TY[c.type].contact)c.label=autoLabel(c);
  solveGroups();
}
function autoLabel(c){const r=c.p.ref||'?';return c.type==='km'?`${r}.1`:`${r}.${cNum(c,1)}`;}
function ufRoots(skip){
  const n=S.np,par=new Int32Array(n);for(let i=0;i<n;i++)par[i]=i;
  const f=i=>{while(par[i]!==i){par[i]=par[par[i]];i=par[i];}return i;};
  const u=(a,b)=>{a=f(a);b=f(b);if(a!==b)par[a]=b;};
  const E=S.wE;for(let i=0;i<E.length;i+=2)u(E[i],E[i+1]);
  let key='';
  for(const c of S.swc){const items=TY[c.type].sw(c);for(const [a,b,on] of items){key+=on?'1':'0';if(on&&!(skip&&skip===c))u(c.pidx[a],c.pidx[b]);}}
  const root=new Int32Array(n);for(let i=0;i<n;i++)root[i]=f(i);
  return {root,key};
}
function groupTerms(root){const G=new Map();
  for(const s of S.srcs){if(s.st.trip)continue;for(const [pn,v,tag] of TY[s.type].terms(s)){const r=root[s.pidx[pn]];if(!G.has(r))G.set(r,[]);G.get(r).push({s,v,tag});}}
  return G;}
function solveGroups(){const {root,key}=ufRoots(null);S.root=root;S.key=key;S.gT=groupTerms(root);
  S.srLive=new Set();for(const c of comps)if(c.type==='sr'&&c.st.pw)for(const pn of ['S11','S21','S33'])S.srLive.add(root[c.pidx[pn]]);}
const rootOf=(c,pn)=>S.root[c.pidx[pn]];
function vAcross(c,a,b,G=S.gT,root=S.root){const ra=root[c.pidx[a]],rb=root[c.pidx[b]];if(ra===rb)return 0;
  const A=G.get(ra),B=G.get(rb);if(!A||!B)return 0;let v=0;
  for(const x of A)for(const y of B)if(x.s===y.s){const d=Math.hypot(x.v.re-y.v.re,x.v.im-y.v.im);if(d>v)v=d;}
  return v;}
function phaseOf(c,pn,G=S.gT,root=S.root){const T=G.get(root[c.pidx[pn]]);if(!T)return null;const t=T.find(x=>x.s.type==='l3');return t?t.tag:null;}
/* oikosulkujen tunnistus: saman lähteen kaksi napaa samassa ryhmässä */
function shortedSources(root){const out=[];for(const s of S.srcs){if(s.st.trip)continue;const rs=TY[s.type].terms(s).map(([pn])=>root[s.pidx[pn]]);
  if(new Set(rs).size<rs.length)out.push(s);}return out;}

/* ---------- aika-askel ---------- */
const togg=[];   // releiden tilanmuutosten ajat (värähtelyn tunnistus)
function stepSim(){
  const t=simT+DT;
  solveGroups();
  /* oikosulut */
  const sh=shortedSources(S.root);
  if(sh.length){for(const s of sh){
      if(s.type==='l3'){let done=false;
        for(const q of S.prot)if(q.type==='qm'&&q.st.on){const r=ufRoots(q).root;if(!shortedSources(r).includes(s)){q.st.on=false;q.st.trip=true;q.st.why='oikosulku';done=true;break;}}
        if(!done){s.st.trip=true;s.st.why='oikosulku';}}
      else{s.st.trip=true;s.st.why='oikosulku';}}
    solveGroups();}
  /* kuormat */
  for(const c of comps){const ty=c.type,p=c.p;
    if(ty==='k'||ty==='kt'||ty==='y'||ty==='lamp'){const U=vAcross(c,TY[ty].ports[0].n,TY[ty].ports[1].n),Un=+p.Un;

/* ---------- piirtosilmukka ---------- */
let lastTs=null,frame=0,simRate=0,rateAcc=0,rateT=0;
function loop(ts){
  const fdt=lastTs===null?0:Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;
  if(running&&comps.length){const t0=performance.now(),want=speed*fdt;const n=Math.round(want/DT);let done=0;const tStart=simT;
    while(done<n){const m=Math.min(50,n-done);for(let i=0;i<m;i++)stepSim();done+=m;if(performance.now()-t0>14)break;}
    rateAcc+=simT-tStart;rateT+=fdt;if(rateT>0.5){simRate=rateAcc/rateT;rateAcc=0;rateT=0;}}
  render();requestAnimationFrame(loop);
}
function render(){
  frame++;
  for(const c of comps){const t=TY[c.type];if(t.dyn){const s=t.dyn(c);if(s!==c.dyS){c.dyEl.innerHTML=s;c.dyS=s;}}}
  if(frame%3===0)for(const w of wires){if(!w.bp)continue;const [col,live]=wireColour(w);w.bp.setAttribute('stroke',col);w.bp.setAttribute('stroke-width',live?3:2);}
  if(frame%4===0)for(const c of comps){const r=showRead&&TY[c.type].read?TY[c.type].read(c):'';if(c.rt.textContent!==r)c.rt.textContent=r;}
  if(frame%2===0)drawTD();
  if(frame%10===0)updDer();
  if(frame%20===0)updWarns();
  $('#simTime').textContent=`t = ${nf(simT,simT<100?2:1)} s`;
  if(frame%15===0){const st=$('#simTime');st.title=tr(`Simulointinopeus ${nf(simRate,2)} s/s, aika-askel 1 ms`,`Simulation rate ${nf(simRate,2)} s/s, time step 1 ms`);}
}

function newLabel(type){const pre=TY[type].px;if(!pre)return '';let i=1;while(comps.some(c=>c.label===pre+i))i++;return pre+i;}
function addComp(type,x,y,p={},opt={}){
  const c={id:opt.id||('c'+(nextId++)),type,x:Math.round(x/10)*10,y:Math.round(y/10)*10,rot:opt.rot||0,label:opt.label||newLabel(type),p:null,pu:Object.assign({},TY[type].def,p)};c.p=c.pu;
  if(TY[type].contact&&!c.pu.ref){const k=comps.filter(x=>x.type==='k');if(k.length)c.pu.ref=k[k.length-1].label;}
  c.st=TY[type].init(c);comps.push(c);byId[c.id]=c;mkCompDom(c);return c;
}
function deleteSel(){
  if(!sel)return;snapshot();
  if(sel.w){wires=wires.filter(w=>w.id!==sel.w);}
  else for(const id of selIds()){const c=byId[id];c.el.remove();c.lbEl.remove();comps=comps.filter(x=>x.id!==id);delete byId[id];
    wires=wires.filter(w=>!w.a.startsWith(id+':')&&!w.b.startsWith(id+':'));
    traces=traces.filter(p=>p.target!==id);}
  sel=null;rebuild();syncAll();buildTDCtl();buildInsp();save();
}
let clip=null;
function copySel(){const ids=selIds();if(!ids.length)return false;const set=new Set(ids);
  clip={comps:ids.map(id=>{const c=byId[id];return {id,type:c.type,x:c.x,y:c.y,rot:c.rot,p:{...c.pu}};}),
    wires:wires.filter(w=>set.has(w.a.split(':')[0])&&set.has(w.b.split(':')[0])).map(w=>({a:w.a,b:w.b,pts:w.pts?w.pts.map(p=>({...p})):null})),n:0};
  flashWarn(tr(`Kopioitu ${ids.length} komponenttia. Liitä näppäimillä Ctrl+V.`,`Copied ${ids.length} components. Paste with Ctrl+V.`));return true;}
function pasteClip(){if(!clip)return;snapshot();clip.n++;const off=40*clip.n,map={};
  for(const c of clip.comps){const n=addComp(c.type,c.x+off,c.y+off,c.p,{rot:c.rot});map[c.id]=n.id;}
  const k=key=>{const i=key.indexOf(':');return map[key.slice(0,i)]+key.slice(i);};
  for(const w of clip.wires)wires.push({id:'w'+(nextId++),a:k(w.a),b:k(w.b),pts:w.pts?w.pts.map(p=>({x:p.x+off,y:p.y+off})):null});
  setSelIds(Object.values(map));rebuild();syncAll();buildInsp();save();}
function selectAll(){setSelIds(comps.map(c=>c.id));renderSel();buildInsp();}
function rotateSel(){if(!sel||!byId[sel.id])return;snapshot();const c=byId[sel.id];c.rot=(c.rot+90)%360;syncAll();save();}
function addWire(a,b){if(a===b)return;if(wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a)))return;snapshot();wires.push({id:'w'+(nextId++),a,b});rebuild();renderPorts();renderWires();save();}
function resetStates(){for(const c of comps){c.st=TY[c.type].init(c);c.dyS=null;}simT=0;togg.length=0;rebuild();clearTraces();}

function ser(){return JSON.stringify({v:1,app:'automaatiosimulaattori',comps:comps.map(c=>({id:c.id,type:c.type,x:c.x,y:c.y,rot:c.rot,label:c.label,p:c.pu})),
  wires:wires.map(w=>{const o={a:w.a,b:w.b};if(w.pts&&w.pts.length)o.pts=w.pts.map(p=>({x:r1(p.x),y:r1(p.y)}));if(w.broken)o.broken=true;return o;}),
  traces:traces.map(x=>({target:x.target,col:x.col})),td:{win:TD.win}});}
function load(json,fit=true){
  const d=typeof json==='string'?JSON.parse(json):json;if(!d||!Array.isArray(d.comps))throw new Error(tr('Tiedostosta puuttuu komponenttilista.','The file has no component list.'));
  lC.innerHTML='';lL.innerHTML='';comps=[];byId={};wires=[];traces=[];sel=null;nextId=1;
  for(const c of d.comps){if(!TY[c.type])continue;const n=parseInt(String(c.id).slice(1))||0;nextId=Math.max(nextId,n+1);addComp(c.type,c.x,c.y,Object.assign({ref:''},c.p),{id:c.id,rot:c.rot,label:c.label});}
  for(const c of comps)if(!('ref' in TY[c.type].def))delete c.pu.ref;
  for(const w of d.wires||[])if(portByKey(w.a)&&portByKey(w.b))wires.push({id:'w'+(nextId++),a:w.a,b:w.b,broken:!!w.broken,pts:Array.isArray(w.pts)?w.pts.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)).map(p=>({x:p.x,y:p.y})):null});
  const used=new Set();
  for(const x of d.traces||[]){if(!byId[x.target]||traces.length>=8)continue;let col=Number.isInteger(x.col)&&!used.has(x.col)?x.col:[0,1,2,3,4,5,6,7].find(i=>!used.has(i));used.add(col);
    traces.push({id:'tr'+(nextId++),target:x.target,col});}
  TD.win=(d.td&&[2,5,10,20,30,60].includes(d.td.win))?d.td.win:10;setTDRun(true);
  resetStates();syncAll();buildTDCtl();buildInsp();if(fit)fitView();
}
const undo=[];
function snapshot(){undo.push(ser());if(undo.length>60)undo.shift();}
function doUndo(){if(!undo.length)return;const s=undo.pop();load(s,false);save();}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('autsim-v1',ser());}catch(e){}},300);}
function fitView(){
  const r=cv.getBoundingClientRect();if(!comps.length){view.k=1;view.tx=r.width/2;view.ty=r.height/2;applyView();return;}
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const c of comps){const b=bbW(c);const tall=!TY[c.type].wide&&(b[3]-b[1])>(b[2]-b[0])+4;x0=Math.min(x0,b[0]-(tall?(TY[c.type].src?70:30):0));x1=Math.max(x1,b[2]+(tall&&!TY[c.type].src?60:0));y0=Math.min(y0,b[1]-(tall?0:20));y1=Math.max(y1,b[3]+(tall?0:20));}
  for(const w of wires)for(const p of w.pts||[]){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
  const padT=56,padB=46,padX=24;const k=clamp(Math.min((r.width-2*padX)/(x1-x0+40),(r.height-padT-padB)/(y1-y0+40)),0.3,1.5);
  view.k=k;view.tx=(r.width-(x1+x0)*k)/2;view.ty=padT+((r.height-padT-padB)-(y1+y0)*k)/2;applyView();
}

function nearestPort(w,maxD=16){let best=null,bd=maxD;for(const c of comps)for(const p of portsW(c)){const d=Math.hypot(p.x-w.x,p.y-w.y);if(d<bd){bd=d;best=p;}}return best;}
function localPt(c,w){const dx=w.x-c.x,dy=w.y-c.y;return rotP(dx,dy,-c.rot);}
cv.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.pointerType==='mouse')return;
  const w=toWorld(e),t=e.target;
  const portEl=t.closest&&t.closest('[data-port]'),compEl=t.closest&&t.closest('.comp'),wireEl=t.closest&&t.closest('.wire');
  cv.setPointerCapture(e.pointerId);
  if(tool==='T'){if(compEl)addTrace(compEl.dataset.id);drag={k:'none'};return;}
  if(portEl){const p=portByKey(portEl.dataset.port);drag={k:'wire',from:p};tmpW.setAttribute('d',`M${p.x},${p.y}L${w.x},${w.y}`);return;}
  if(compEl&&e.shiftKey){const c=byId[compEl.dataset.id];const ids=selIds();setSelIds(ids.includes(c.id)?ids.filter(x=>x!==c.id):[...ids,c.id]);renderSel();buildInsp();drag={k:'none'};return;}
  if(compEl&&sel&&sel.ids&&sel.ids.includes(compEl.dataset.id)){const ids=selIds(),set=new Set(ids);
    drag={k:'gmove',c:byId[compEl.dataset.id],sx:e.clientX,sy:e.clientY,moved:false,w0:w,orig:ids.map(id=>({c:byId[id],x:byId[id].x,y:byId[id].y})),
      ws:wires.filter(x=>x.pts&&set.has(x.a.split(':')[0])&&set.has(x.b.split(':')[0])).map(x=>({w:x,pts:x.pts.map(p=>({...p}))}))};return;}
  if(compEl){const c=byId[compEl.dataset.id];sel={id:c.id};renderSel();buildInsp();const t2=TY[c.type];const [lx,ly]=localPt(c,w);
    const h=t2.hitAt?t2.hitAt(c,lx,ly):t2.hit?t2.hit(c):null;
    if(h&&t2.press&&c.p.toim==='palautuva'){c.st.on=true;drag={k:'press',c};buildInsp();return;}
    drag={k:'move',c,sx:e.clientX,sy:e.clientY,ox:c.x,oy:c.y,hit:h,moved:false};return;}
  if(wireEl){const wi=wires.find(x=>x.id===wireEl.dataset.w);sel={w:wi.id};renderSel();buildInsp();drag={k:'seg',w:wi,sx:e.clientX,sy:e.clientY,moved:false,...segPick(wi,w)};return;}
  if(e.shiftKey){drag={k:'box',w0:w,w1:w,base:selIds()};return;}
  sel=null;renderSel();buildInsp();drag={k:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty};
});
cv.addEventListener('pointermove',e=>{
  if(!drag){hoverTip(e);return;}
  tip.style.display='none';
  if(drag.k==='pan'){view.tx=drag.tx+e.clientX-drag.sx;view.ty=drag.ty+e.clientY-drag.sy;applyView();}
  else if(drag.k==='move'){const dx=(e.clientX-drag.sx)/view.k,dy=(e.clientY-drag.sy)/view.k;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4){drag.moved=true;snapshot();}
    if(drag.moved){drag.c.x=Math.round((drag.ox+dx)/10)*10;drag.c.y=Math.round((drag.oy+dy)/10)*10;placeComp(drag.c);renderPorts();renderWires();renderSel();}}
  else if(drag.k==='wire'){const w=toWorld(e);const p=nearestPort(w,14);const tx=p?p.x:w.x,ty=p?p.y:w.y;tmpW.setAttribute('d',`M${drag.from.x},${drag.from.y}L${tx},${ty}`);}
  else if(drag.k==='gmove'){
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4){drag.moved=true;snapshot();}
    if(drag.moved){const dx=Math.round((e.clientX-drag.sx)/view.k/10)*10,dy=Math.round((e.clientY-drag.sy)/view.k/10)*10;
      for(const o of drag.orig){o.c.x=o.x+dx;o.c.y=o.y+dy;placeComp(o.c);}for(const o of drag.ws)o.w.pts=o.pts.map(p=>({x:p.x+dx,y:p.y+dy}));
      renderPorts();renderWires();renderSel();}}
  else if(drag.k==='box'){drag.w1=toWorld(e);renderSel();const r=mk('rect','boxsel',lS),x=Math.min(drag.w0.x,drag.w1.x),y=Math.min(drag.w0.y,drag.w1.y);
    r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',Math.abs(drag.w1.x-drag.w0.x));r.setAttribute('height',Math.abs(drag.w1.y-drag.w0.y));}
  else if(drag.k==='seg'){
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4){drag.moved=true;snapshot();}
    if(drag.moved&&drag.pts){const P=drag.pts.map(p=>({...p})),i=drag.i;
      if(drag.horiz){const y=Math.round((drag.o+(e.clientY-drag.sy)/view.k)/10)*10;P[i].y=y;P[i+1].y=y;}
      else{const x=Math.round((drag.o+(e.clientX-drag.sx)/view.k)/10)*10;P[i].x=x;P[i+1].x=x;}
      drag.w.pts=P.slice(1,-1);renderWires();renderSel();}}
});
function endDrag(e){
  if(!drag)return;
  if(drag.k==='wire'){const w=toWorld(e);const p=nearestPort(w,14);if(p&&p.k!==drag.from.k)addWire(drag.from.k,p.k);tmpW.setAttribute('d','');}
  if(drag.k==='move'){if(drag.moved)save();else if(drag.hit){const t=TY[drag.c.type];if(t.click){t.click(drag.c,drag.hit);buildInsp();}}}
  if(drag.k==='press'){drag.c.st.on=false;buildInsp();}
  if(drag.k==='gmove'){if(drag.moved)save();else{const c=drag.c;sel={id:c.id};renderSel();buildInsp();const t=TY[c.type];if(t.hit&&t.click){t.click(c,t.hit(c));buildInsp();}}}
  if(drag.k==='box'){const x0=Math.min(drag.w0.x,drag.w1.x),x1=Math.max(drag.w0.x,drag.w1.x),y0=Math.min(drag.w0.y,drag.w1.y),y1=Math.max(drag.w0.y,drag.w1.y);
    const hit=comps.filter(c=>{const b=bbW(c);return b[0]<x1&&b[2]>x0&&b[1]<y1&&b[3]>y0;}).map(c=>c.id);setSelIds([...drag.base,...hit]);renderSel();buildInsp();}
  if(drag.k==='seg'&&drag.moved){const a=portByKey(drag.w.a),b=portByKey(drag.w.b);drag.w.pts=simplifyPts(wirePts(drag.w,a,b)).slice(1,-1);renderWires();renderSel();buildInsp();save();}
  drag=null;
}

  const k2=clamp(view.k*Math.exp(-e.deltaY*0.0015),0.3,3);view.tx=mx-(mx-view.tx)*k2/view.k;view.ty=my-(my-view.ty)*k2/view.k;view.k=k2;applyView();},{passive:false});
function hoverTip(e){
  const t=e.target,stage=$('#stage').getBoundingClientRect();let s='';
  const portEl=t.closest&&t.closest('[data-port]'),wireEl=t.closest&&t.closest('.wire');
  const pot=k=>{const i=S.pi[k];const T=i!==undefined?S.gT.get(S.root[i]):null;return T&&T.length?T.map(x=>`${x.s.label} ${x.tag==='+'?'+':x.tag==='0'?(x.s.type==='dc'?'0V':'N'):x.tag}`).join(', '):tr('jännitteetön','de-energised');};
  if(portEl){const p=portByKey(portEl.dataset.port);if(p)s=`${dispLabel(p.c)}${p.lab?'.'+p.lab:''}: ${pot(p.k)}`;}
  else if(wireEl){const w=wires.find(x=>x.id===wireEl.dataset.w);if(w)s=w.broken?tr('katkennut johdin','broken wire'):pot(w.a);}
  if(!s){tip.style.display='none';return;}
  tip.textContent=s;tip.style.display='block';tip.style.left=(e.clientX-stage.left+14)+'px';tip.style.top=(e.clientY-stage.top+14)+'px';
}
function segPick(wi,pt){
  const a=portByKey(wi.a),b=portByKey(wi.b);if(!a||!b)return {pts:null};
  let P=(wi.path||wirePts(wi,a,b)).map(p=>({x:p.x,y:p.y}));let bi=0,bd=Infinity;
  for(let i=0;i<P.length-1;i++){const p=P[i],q=P[i+1];const t=c01(((pt.x-p.x)*(q.x-p.x)+(pt.y-p.y)*(q.y-p.y))/(((q.x-p.x)**2+(q.y-p.y)**2)||1));
    const d=Math.hypot(pt.x-(p.x+t*(q.x-p.x)),pt.y-(p.y+t*(q.y-p.y)));if(d<bd){bd=d;bi=i;}}
  if(bi===0){P.unshift({...P[0]});bi=1;}if(bi===P.length-2){P.push({...P[P.length-1]});}
  const horiz=Math.abs(P[bi].y-P[bi+1].y)<0.5;return {pts:P,i:bi,horiz,o:horiz?P[bi].y:P[bi].x};
}

<h3>Releet ja koskettimet</h3><p>Kela (rele, kontaktori, aikarele) ja sen koskettimet ovat erillisiä komponentteja kuten piirikaaviossa. Kosketin liitetään laitteeseen ominaisuuspaneelin kohdassa Kuuluu laitteeseen, ja sen numerot määräytyvät tyypin ja kosketinnumeron mukaan (rele 13–14 / 21–22, aikarele 17–18 / 15–16, lämpörele 95–96 / 97–98). Kontaktorin pääkoskettimet 1–6 ovat oma komponenttinsa.</p>
<h3>Ohjaus</h3><p>Painiketta painetaan pitämällä hiiren nappia pohjassa painikkeen käyttölaitteen (vasen reuna) päällä. Hätäseis, valintakytkin, moottorinsuojakytkin, lämpöreleen palautus ja lähteiden kuittaus toimivat klikkaamalla. Anturit ohjautuvat sylinterin asennosta tai käsin, jos toimilaitetta ei ole valittu.</p>
<h3>Aikakaavio</h3><p>Valitse työkaluriviltä Aikakaavioon ja klikkaa komponenttia. Kaavio näyttää kelojen, koskettimien, painikkeiden, anturien ja lamppujen tilat sekä sylinterien asennot ja moottorien pyörimisnopeudet. Klikkaa kaaviota: kaksi kursoria näyttää aikaeron.</p>
<h3>Viat</h3><p>Koskettimille, kelille, antureille ja hätäseisille voi asettaa vian ominaisuuspaneelissa (esimerkiksi hitsautunut kosketin tai katkennut kela). Johtimen voi katkaista valitsemalla johtimen.</p>
<h3>Malli ja rajoitukset</h3><p>Piiri ratkaistaan johtavuustarkasteluna 1 ms aika-askeleella: kuorma toimii, kun sen navat ovat saman lähteen eri napojen kanssa yhteydessä ja jännite on vähintään 70 % nimellisjännitteestä. Releen veto- ja päästöaika on 10 ms, kontaktorin 25 ms. Lämpöreleen ja moottorinsuojakytkimen laukaisu lasketaan lämpömallilla (aikavakio 100 s, laukeaminen 1,2·Ir pysyvällä virralla). Kosketinpomppua, valokaarta, kelojen induktiivisia ilmiöitä ja paineilman virtausta ei mallinneta.</p>

`<h2>Help</h2>
<p>Full user manual with examples and exercises (in Finnish): <a href="https://jipirtti.github.io/Automaatiosimulaattori/docs/kayttoohje.html" target="_blank" rel="noopener">Automation simulator user manual</a>.</p>
<h3>Building a circuit</h3><p>Drag a component from the left onto the canvas, or click it. Connect a wire by dragging from one terminal to another. Several wires can be connected to the same terminal. Use a junction to branch from the middle of a rail. Reshape a wire by dragging a section of it. Select several components by dragging with Shift held down or with Shift+click.</p>
<h3>Relays and contacts</h3><p>A coil (relay, contactor, timer relay) and its contacts are separate components, as in a circuit diagram. A contact is linked to its device in the properties panel under Belongs to, and its terminal numbers follow the type and contact number (relay 13–14 / 21–22, timer relay 17–18 / 15–16, overload relay 95–96 / 97–98). The contactor main contacts 1–6 are a component of their own.</p>
<h3>Operating</h3><p>Press a push button by holding the mouse button down on its actuator (left edge). Emergency stop, selector switch, motor protection switch, overload relay reset and supply reset work by clicking. Sensors follow the cylinder position, or are operated by hand if no actuator is selected.</p>
<h3>Timing diagram</h3><p>Choose To timing diagram on the toolbar and click a component. The diagram shows the states of coils, contacts, buttons, sensors and lamps, the cylinder positions and the motor speeds. Click the diagram: two cursors show a time difference.</p>
<h3>Faults</h3><p>Contacts, coils, sensors and emergency stops can be given a fault in the properties panel (for example a welded contact or an open coil). A wire can be broken by selecting it.</p>
<h3>Model and limitations</h3><p>The circuit is solved as a connectivity problem with a 1 ms time step: a load operates when its terminals are connected to different terminals of the same source and the voltage is at least 70 % of the rated voltage. Relay operate and release time is 10 ms, contactor 25 ms. Overload and motor protection tripping uses a thermal model (time constant 100 s, trips at a steady 1.2·Ir). Contact bounce, arcing, inductive coil effects and compressed-air flow are not modelled.</p>

/* ---------- kielen vaihto ---------- */
function applyStatic(){
  document.querySelectorAll('[data-en]').forEach(el=>{if(el.dataset.fi===undefined)el.dataset.fi=el.textContent;el.textContent=lang==='en'?el.dataset.en:el.dataset.fi;});
  document.querySelectorAll('[data-en-title]').forEach(el=>{if(el.dataset.fiTitle===undefined)el.dataset.fiTitle=el.getAttribute('title');el.setAttribute('title',lang==='en'?el.dataset.enTitle:el.dataset.fiTitle);});
  document.querySelectorAll('[data-en-aria]').forEach(el=>{if(el.dataset.fiAria===undefined)el.dataset.fiAria=el.getAttribute('aria-label');el.setAttribute('aria-label',lang==='en'?el.dataset.enAria:el.dataset.fiAria);});
  document.documentElement.lang=lang;document.title=lang==='en'?'Automation Simulator':'Automaatiosimulaattori';
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  buildLegend();
}
function setLang(l){if(l!=='fi'&&l!=='en')return;lang=l;try{localStorage.setItem('autsim-lang',l);}catch(e){}
  try{const u=new URL(location.href);if(u.searchParams.has('lang')){u.searchParams.set('lang',l);history.replaceState(null,'',u);}}catch(e){}
  applyStatic();buildPalette();setRun(running);for(const c of comps){renderStatic(c);placeComp(c);}buildInsp();buildTDCtl();if(modal.classList.contains('open'))closeModal();updWarns();}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

/* ---------- testi- ja validointirajapinta (tests/*.py) ---------- */
const byLabel=l=>{const c=comps.find(x=>x.label===l);if(!c)throw new Error('Komponenttia ei löydy: '+l);return c;};
function runFor(sec){setRun(false);const n=Math.round(sec/DT);for(let i=0;i<n;i++)stepSim();return simT;}
const plain=o=>{const r={};for(const k in o)if(['number','boolean','string'].includes(typeof o[k]))r[k]=o[k];return r;};
const actv=c=>{const t=TY[c.type];const v=t.active?t.active(c):null;return typeof v==='number'?v:!!v;};
window.AutSim={
  version:'1.0.0',
  setLang:l=>{setLang(l);return lang;},lang:()=>lang,
  warningCodes:()=>{updWarns();return lastWarnCodes.slice();},
  warnings:()=>{updWarns();return [...document.querySelectorAll('#warns div')].map(d=>d.textContent);},
  loadExample:k=>{if(!EX[k])throw new Error('Tuntematon esimerkki '+k);load(EX[k],false);setRun(false);fitView();return comps.map(c=>c.label);},
  loadCircuit:j=>{load(j,false);setRun(false);fitView();return comps.map(c=>c.label);},
  serialize:()=>ser(),pause:()=>setRun(false),reset:()=>{resetStates();},
  run:sec=>runFor(sec),time:()=>simT,
  press:(l,sec=0.2)=>{const c=byLabel(l);c.st.on=true;runFor(sec);c.st.on=false;return simT;},
  hold:(l,on)=>{byLabel(l).st.on=!!on;},
  click:l=>{const c=byLabel(l);const t=TY[c.type];if(t.click)t.click(c,'k');return plain(c.st);},
  state:l=>plain(byLabel(l).st),active:l=>actv(byLabel(l)),
  setParam:(l,k,v)=>{const c=byLabel(l);setP(c,k,v);paramChanged(c);return {...c.p};},param:l=>({...byLabel(l).p}),
  wires:()=>wires.map((w,i)=>{const a=portByKey(w.a),b=portByKey(w.b);return {i,a:`${a.c.label}:${a.n}`,b:`${b.c.label}:${b.n}`,broken:!!w.broken};}),
  breakWire:(i,on=true)=>{wires[i].broken=!!on;rebuild();renderWires();return !!wires[i].broken;},
  record:(labels,sec)=>{setRun(false);const cs=labels.map(byLabel),out={};labels.forEach((l,j)=>out[l]=[[simT,actv(cs[j])]]);const n=Math.round(sec/DT);
    for(let i=0;i<n;i++){stepSim();cs.forEach((c,j)=>{const v=actv(c),L=out[labels[j]];if(typeof v==='boolean'?v!==L[L.length-1][1]:false)L.push([simT,v]);});}return out;},
  runUntil:(l,maxSec)=>{setRun(false);const c=byLabel(l);const v0=actv(c);const n=Math.round(maxSec/DT);for(let i=0;i<n;i++){stepSim();if(actv(c)!==v0)return simT;}return null;},
  addTrace:l=>{addTrace(byLabel(l).id);return traces.map(x=>traceLabel(x));},traces:()=>traces.map(x=>traceLabel(x)),
  labels:()=>comps.map(c=>c.label),selection:()=>selIds().map(id=>byId[id].label),
  info:()=>({ports:S.np,groups:new Set(S.root).size,dt:DT})
};

/* ---------- käynnistys ---------- */
applyStatic();buildPalette();applyView();setRun(running);
$('#speed').value=String(speed);
let stored=null;try{stored=localStorage.getItem('autsim-v1');}catch(e){}
try{if(stored&&JSON.parse(stored).comps.length)load(stored);else load(EX.ex1);}catch(e){load(EX.ex1);}
updWarns();
requestAnimationFrame(loop);
})();
